<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登販 禁忌チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&display=swap">
<style>
/* Layout: 添付文書の「使用上の注意」枠を下敷きに、左で条件を選び右に該当成分が並ぶ2ペイン（狭い画面では縦積み） */
:root{
  --paper:#f5f6f3; --card:#ffffff; --ink:#1c2731; --muted:#5a6670; --line:#d5dad5; --soft:#eceee9;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --ng:#b8142c; --ng-bg:#fbe9ec; --ng-line:#e8b4bd;
  --sd:#9a5d00; --sd-bg:#fbf1dc; --sd-line:#e8cf9c;
  --ct:#2d5a86; --ct-bg:#e7eef6; --ct-line:#b9cde2;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  --f-disp:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121618; --card:#1a2024; --ink:#e4e9ec; --muted:#98a4ac; --line:#2d363c; --soft:#20282d;
  --accent:#58c2a5; --accent-ink:#0d1a16; --accent-soft:#183129;
  --ng:#ff7487; --ng-bg:#3a1920; --ng-line:#6b2c37;
  --sd:#f0b54e; --sd-bg:#33260e; --sd-line:#5e4718;
  --ct:#86b6e6; --ct-bg:#162533; --ct-line:#2c4660; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121618; --card:#1a2024; --ink:#e4e9ec; --muted:#98a4ac; --line:#2d363c; --soft:#20282d;
  --accent:#58c2a5; --accent-ink:#0d1a16; --accent-soft:#183129;
  --ng:#ff7487; --ng-bg:#3a1920; --ng-line:#6b2c37;
  --sd:#f0b54e; --sd-bg:#33260e; --sd-line:#5e4718;
  --ct:#86b6e6; --ct-bg:#162533; --ct-line:#2c4660; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--f-disp);font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
h1 .home{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;letter-spacing:0;margin-bottom:6px}
h1 .home:hover{text-decoration:underline}
h1 small{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:3px;border:1px solid;white-space:nowrap;line-height:1.7}
.b-ng{color:var(--ng);background:var(--ng-bg);border-color:var(--ng-line)}
.b-sd{color:var(--sd);background:var(--sd-bg);border-color:var(--sd-line)}
.b-ct{color:var(--ct);background:var(--ct-bg);border-color:var(--ct-line)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap}
@media (max-width:560px){nav.tabs{gap:0}nav.tabs button{flex:1 1 auto;padding:8px 4px;font-size:13px;line-height:1.35}}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.chip:focus-visible,.btn:focus-visible,input:focus-visible,.ikey:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pane{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.pane{grid-template-columns:minmax(0,1fr)}}
.picker{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px}
@media (min-width:861px){.picker{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}}
.grp h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:700}
.grp .hint{font-size:11.5px;color:var(--muted);margin:-2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;line-height:1.6}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.results{display:flex;flex-direction:column;gap:18px;min-width:0}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.selbar .lab{color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:1px 8px;font-size:12.5px}
.count{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.count b{font-variant-numeric:tabular-nums;font-size:18px;margin-right:2px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:28px 20px;color:var(--muted);text-align:center}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0}
table.agg{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:14px}
table.agg th,table.agg td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.agg th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--soft);letter-spacing:.05em}
table.agg tr:last-child td{border-bottom:0}
table.agg td.lv{width:1%;white-space:nowrap}
table.agg td.vc{color:var(--muted);font-size:12.5px;min-width:9em;width:28%}
.tblwrap{overflow-x:auto;border-radius:6px}
.box{border:2px solid;border-radius:6px;background:var(--card);overflow:hidden}
.box.ng{border-color:var(--ng)} .box.sd{border-color:var(--sd)} .box.ct{border-color:var(--ct)}
.box>h2{margin:0;font-size:15px;padding:7px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.box.ng>h2{background:var(--ng);color:var(--card)} .box.sd>h2{background:var(--sd);color:var(--card)} .box.ct>h2{background:var(--ct);color:var(--card)}
.box>h2 span{font-weight:400;font-size:12px;opacity:.9}
.rule{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.box>.rule:first-of-type{border-top:0}
.rule .cond{font-weight:700;font-size:14px}
.rule .via{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.items{display:flex;flex-wrap:wrap;gap:5px}
.it{font-size:13.5px;padding:2px 9px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.box.ng .it{background:var(--ng-bg);border-color:var(--ng-line)}
.box.sd .it{background:var(--sd-bg);border-color:var(--sd-line)}
.box.ct .it{background:var(--ct-bg);border-color:var(--ct-line)}
.why{font-size:13px;color:var(--muted)}
.why::before{content:"理由　";font-weight:700;color:var(--ink)}
.src{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--sd);font-weight:700}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:5px;max-height:none}
.ikey{font:inherit;font-size:12.5px;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:2px 8px;cursor:pointer}
.ikey[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kh{font-size:11px;color:var(--muted);margin:8px 0 4px;letter-spacing:.06em}
mark{background:var(--accent-soft);color:inherit;padding:0 1px;border-radius:2px}
.pair{font-weight:700;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pair .x{color:var(--muted);font-weight:400}
.pair .p{padding:1px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.pair .p.on{border-color:var(--accent);background:var(--accent-soft)}
.jump{display:none}
@media (max-width:860px){
  .jump{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;box-shadow:0 -2px 10px rgba(0,0,0,.18)}
  .jump[hidden]{display:none!important}
  .jump .sum{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 10px}
  .jump .sum b{font-size:16px;font-variant-numeric:tabular-nums}
  .jump .sum .n{color:var(--ng-line)} .jump .sum .s{color:var(--sd-line)}
  .jump button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:8px 14px;white-space:nowrap;cursor:pointer}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .results{scroll-margin-top:12px}
}

/* 成分カード連携 */
button.it.link{font:inherit;font-size:13.5px;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-color:var(--muted)}
button.it.link::after{content:"›";margin-left:5px;color:var(--accent);font-weight:700;text-decoration:none;display:inline-block}
button.it.link:hover{border-color:var(--accent)}
button.it.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.agg button.alink{font:inherit;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-color:var(--muted)}
table.agg button.alink::after{content:"›";margin-left:5px;color:var(--accent);font-weight:700;display:inline-block}
.hintline{font-size:12px;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,16,20,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet-bg{align-items:center;padding:24px}}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:min(82vh,820px);display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
@media (min-width:720px){.sheet{border-radius:10px}}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h .ttl{flex:1;min-width:0}
.sheet-h .ttl small{display:block;font-size:11.5px;color:var(--muted)}
.sheet-h .ttl b{font-size:15px;line-height:1.45;display:block}
.sheet-h button{font:inherit;font-size:13px;background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;flex:none}
.sheet-b{overflow-y:auto;padding:4px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.scard{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.scard:last-child{border-bottom:0}
.scard .nm{font-weight:700;font-size:16px;line-height:1.4}
.scard .nm .yomi{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.scard .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.scard .meta span{background:var(--accent-soft);border-radius:3px;padding:0 7px}
.scard dl{margin:0;display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.scard dt{color:var(--muted);font-weight:700;font-size:12px;padding-top:2px}
.scard dd{margin:0}
.scard dd.warn{color:var(--ink);background:var(--sd-bg);border-left:3px solid var(--sd);padding:4px 8px;border-radius:0 3px 3px 0}
.sheet-f{font-size:11px;color:var(--muted);padding-top:10px}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){.rule,.agg tr{animation:fi .18s ease-out}@keyframes fi{from{opacity:.4}to{opacity:1}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1><a class="home" href="index.html">← ホーム</a>登販 禁忌チェッカー<small>試験問題の作成に関する手引き（令和8年4月一部改訂）第5章 別表5-1・5-2／第3章【相互作用】より</small></h1>
    <div class="legend">
      <span class="badge b-ng">使用しないこと</span>
      <span class="badge b-sd">相談すること</span>
      <span class="badge b-ct">併用に注意（第3章）</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="t-cond" data-tab="cond" aria-selected="true">持病・属性から探す</button>
    <button role="tab" id="t-ingr" data-tab="ingr" aria-selected="false">成分から探す</button>
    <button role="tab" id="t-combo" data-tab="combo" aria-selected="false">飲み合わせ</button>
  </nav>

  <section id="v-cond" class="pane">
    <div class="picker" id="picker"></div>
    <div class="results" id="cond-out"></div>
  </section>

  <section id="v-ingr" class="pane" hidden>
    <div class="picker">
      <div class="search"><input id="q" type="search" placeholder="成分名で検索（例：プソイドエフェドリン）" autocomplete="off"></div>
      <div id="keys"></div>
    </div>
    <div class="results" id="ingr-out"></div>
  </section>

  <section id="v-combo" class="pane" hidden>
    <div class="picker" id="combo-picker"></div>
    <div class="results" id="combo-out"></div>
  </section>

  <div class="jump" id="jump" hidden><div class="sum" id="jump-sum"></div><button id="jump-btn">結果を見る ↓</button></div>

  <div class="sheet-bg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-ttl"><div class="sheet-h"><div class="ttl"><small>成分カード</small><b id="sheet-ttl"></b></div><button id="sheet-x">閉じる</button></div><div class="sheet-b" id="sheet-b"></div></div></div>

  <footer>
    <div>出典：厚生労働省「試験問題の作成に関する手引き（令和8年4月一部改訂）」第5章 別表5-1「してはいけないこと」・5-2「相談すること」（pp.401–411）、第3章 各薬効群の【相互作用】。各カードのページ番号は手引きの印刷ページ。</div>
    <div>手引きの別表は「主な」成分・薬効群の例示です。実際の販売時は製品の添付文書を必ず確認してください。学習用ツールです。</div>
  </footer>
</div>

<script src="seibun-data.js"></script>
<script>
/* ===== 選択肢（チップ） ===== */
const GROUPS = [
  {id:'dis', title:'持病・診断', chips:[
    ['glaucoma','緑内障'],['heart','心臓病'],['htn','高血圧'],['dm','糖尿病'],['thy','甲状腺の病気'],
    ['gu','胃・十二指腸潰瘍'],['ibd','潰瘍性大腸炎・クローン病（既往）'],['liver','肝臓病'],['kidney','腎臓病'],['dialysis','透析を受けている'],
    ['bph','前立腺肥大'],['epi','てんかん'],['insomnia','不眠症・日常的な不眠'],['thromb','血栓症・血栓のおそれ'],['anemia','貧血'],['sle','全身性エリテマトーデス・混合性結合組織病']]},
  {id:'sym', title:'いまの症状・状態', chips:[
    ['fever','発熱・高熱'],['seizure','けいれん（を起こしたことがある）'],['flu','水痘（水ぼうそう）・インフルエンザ（疑い含む）'],
    ['dysuria','排尿困難'],['hyperacid','胃酸過多'],['abd','激しい腹痛'],['nausea','吐き気・嘔吐'],['edema','むくみ'],
    ['diarrhea','下痢'],['sdiar','急性のはげしい下痢'],['fdiar','発熱を伴う下痢・血便・粘液便'],['anal','便秘を避けるべき肛門疾患'],['hbleed','痔出血'],
    ['mouth','口の中の傷・ひどいただれ'],['eyepain','はげしい目の痛み']]},
  {id:'age', title:'年齢', single:true, hint:'1つ選択（もう一度押すと解除）', chips:[
    ['a_neo','新生児（1ヶ月未満）'],['a_inf','1ヶ月〜2歳'],['a_3','3〜5歳'],['a_6','6〜11歳'],['a_12','12〜14歳'],['a_ad','15〜64歳'],['a_el','高齢者（65歳以上）']]},
  {id:'preg', title:'妊娠・授乳', hint:'妊娠の時期は1つ、授乳は併せて選べます', chips:[
    ['p_early','妊娠初期（〜3ヶ月）'],['p_mid','妊娠中（3ヶ月以降）'],['p_late','出産予定日まで12週以内'],['p_plan','妊娠を希望'],['lact','授乳中']]},
  {id:'alg', title:'アレルギー歴', chips:[
    ['allergy','薬の成分でアレルギー'],['asthma','喘息を起こしたことがある'],['aspasthma','かぜ薬・解熱鎮痛薬で喘息'],
    ['ketoal','チアプロフェン酸・スプロフェン・フェノフィブラートでかぶれ等'],['uvfilter','オキシベンゾン・オクトクリレン（日焼け止め等）でかぶれ等'],['milk','牛乳アレルギー']]},
  {id:'life', title:'生活・使い方', chips:[
    ['drive','車・機械を運転する'],['alcohol','お酒を飲む'],['caffeine','コーヒー・お茶をよく飲む'],['uv','屋外で活動する（紫外線）'],
    ['longuse','長く使い続けたい（連用）'],['overdose','多めに使いたい（大量・過量）']]},
  {id:'med', title:'使用中の薬・治療', chips:[
    ['laxative','下剤（瀉下薬）を使用中'],['castor','ヒマシ油を使用中'],['anthelm','駆虫薬を使用中'],
    ['maoi','モノアミン酸化酵素阻害剤（セレギリン等）で治療中'],['ifn','インターフェロン製剤で治療中']]},
  {id:'site', title:'外用薬を使う部位', chips:[
    ['s_eye','目の周囲・粘膜'],['s_soft','首まわり・顔面などやわらかい皮膚'],['s_eczema','湿疹・かぶれ・傷口'],['s_genital','陰のう・外陰部'],
    ['s_tinea','みずむし・たむしの患部'],['pus','化膿している患部'],['s_wet','湿潤・ただれ・亀裂・ひどい外傷'],['s_infl','炎症・傷のある患部'],['s_burn','深い傷・ひどいやけど']]}
];
const CHIP = {}; GROUPS.forEach(g=>g.chips.forEach(([id,l])=>CHIP[id]={label:l,group:g.id}));
const PREG_STAGE = ['p_early','p_mid','p_late','p_plan'];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== 成分カード連携（成分カード seibun.html のデータ） ===== */
const SEIBUN = (typeof D!=='undefined' && Array.isArray(D)) ? D : [];  // seibun-data.js
const S_STOP = new Set(['外用','点眼','点鼻','浣腸薬','消毒薬','口内炎','内服','DSS']);
const S_TOK = [];
SEIBUN.forEach((c,ci)=>c.n.replace(/[（(]/g,'・').replace(/[）)]/g,'').split(/[・、／\/]/).map(x=>x.trim())
  .filter(x=>x.length>=2 && !S_STOP.has(x) && !x.includes('等')).forEach(t=>S_TOK.push({t,ci})));
const S_ALIAS = [ {re:/ステロイド性抗炎症成分|副腎皮質ホルモン/, pick:c=>c.k==='ステロイド性抗炎症成分'} ];
const WORDCH=/[\u30A1-\u30FC\u4E00-\u9FFF]/, KATA=/[\u30A1-\u30FC]/;
const S_CACHE = new Map();
function cardsFor(item){
  if(S_CACHE.has(item)) return S_CACHE.get(item);
  const m=[];
  S_TOK.forEach(({t,ci})=>{ let i=item.indexOf(t);
    while(i>=0){ const pv=item[i-1], nx=item[i+t.length];
      if(!(pv&&WORDCH.test(pv)) && !(nx&&KATA.test(nx))) m.push({s:i,e:i+t.length,ci});
      i=item.indexOf(t,i+1); } });
  if(!m.length && item.length>=4) S_TOK.forEach(({t,ci})=>{ if(t.startsWith(item)) m.push({s:0,e:item.length,ci}); });
  const keep=m.filter(a=>!m.some(b=>b.ci!==a.ci && b.s<=a.s && b.e>=a.e && (b.e-b.s)>(a.e-a.s)));
  const seen=new Set(), out=[];
  keep.sort((a,b)=>a.s-b.s).forEach(x=>{ if(!seen.has(x.ci)){seen.add(x.ci); out.push(x.ci);} });
  S_ALIAS.forEach(a=>{ if(a.re.test(item)) SEIBUN.forEach((c,ci)=>{ if(a.pick(c)&&!seen.has(ci)){seen.add(ci);out.push(ci);} }); });
  S_CACHE.set(item,out); return out;
}
function itemHTML(i,inner){ inner=inner??esc(i); return cardsFor(i).length?`<button class="it link" data-it="${esc(i)}">${inner}</button>`:`<span class="it">${inner}</span>`; }
let sheetReturn=null;
function openSheet(item){
  const cs=cardsFor(item); if(!cs.length) return;
  sheetReturn=document.activeElement;
  $('#sheet-ttl').textContent=item;
  $('#sheet-b').innerHTML=cs.map(ci=>{const c=SEIBUN[ci]; return `<div class="scard"><div class="nm">${esc(c.n)}${c.y?`<span class="yomi">${esc(c.y)}</span>`:''}</div>
    <div class="meta"><span>${esc(c.t)}</span><span>${esc(c.g)}</span></div>
    <dl>${c.k?`<dt>分類</dt><dd>${esc(c.k)}</dd>`:''}${c.e?`<dt>${c.t==='漢方'?'適応':'作用'}</dt><dd>${esc(c.e)}</dd>`:''}${c.w?`<dt>${c.t==='漢方'?'構成':'配合先'}</dt><dd>${esc(c.w)}</dd>`:''}${c.x?`<dt>注意</dt><dd class="warn">${esc(c.x)}</dd>`:''}</dl></div>`;}).join('')
    + `<div class="sheet-f">成分カード（手引き第3章の要約）より。${cs.length>1?'この項目に含まれる成分をまとめて表示しています。':''}</div>`;
  $('#sheet').hidden=false; $('#sheet-b').scrollTop=0; $('#sheet-x').focus();
}
function closeSheet(){ $('#sheet').hidden=true; if(sheetReturn&&document.contains(sheetReturn)) sheetReturn.focus(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-it]'); if(b){ openSheet(b.dataset.it); return; }
  if(e.target.id==='sheet'||e.target.id==='sheet-x') closeSheet();
});

/* ===== Tab 1: 条件から探す ===== */
const sel = new Set(['glaucoma']); let age = null;
function renderPicker(){
  $('#picker').innerHTML = GROUPS.map(g=>`<div class="grp"><h3>${g.title}</h3>${g.hint?`<p class="hint">${g.hint}</p>`:''}<div class="chips">${
    g.chips.map(([id,l])=>`<button class="chip" id="c-${id}" data-id="${id}" data-g="${g.id}" aria-pressed="${g.single?age===id:sel.has(id)}">${esc(l)}</button>`).join('')}</div></div>`).join('')
    + `<div><button class="btn" id="clear">選択をすべて解除</button></div>`;
}
function ruleHits(r){
  const via=[]; let note='';
  const ageOK = r.age ? (age && AGES[r.age].includes(age)) : null;
  if(r.age && !r.c){ if(ageOK) via.push(CHIP[age].label); else return null; }
  else if(r.age && r.c){
    const cs=r.c.filter(x=>sel.has(x)); if(!cs.length) return null;
    if(age && !ageOK) return null;
    cs.forEach(x=>via.push(CHIP[x].label));
    if(ageOK) via.push(CHIP[age].label); else note=`※${AGE_LABEL[r.age]}の場合`;
  } else {
    const cs=r.c.filter(x=>sel.has(x)); if(!cs.length) return null; cs.forEach(x=>via.push(CHIP[x].label));
  }
  return {via,note};
}
function ruleCard(r,h,showVia=true){
  return `<div class="rule"><div class="cond">「${esc(r.cond)}」</div>
   ${showVia&&h?`<div class="via">該当：${h.via.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}${h.note?`<span class="note">${esc(h.note)}</span>`:''}</div>`:''}
   <div class="items">${r.it.map(i=>itemHTML(i)).join('')}</div>
   <div class="why">${esc(r.why)}</div><div class="src">${srcText(r)}</div></div>`;
}
function renderCond(){
  const chosen=[...sel].map(x=>CHIP[x].label).concat(age?[CHIP[age].label]:[]);
  const hits=RULES.map(r=>({r,h:ruleHits(r)})).filter(x=>x.h);
  const ng=hits.filter(x=>x.r.lv==='ng'), sd=hits.filter(x=>x.r.lv==='sd');
  let html=`<div class="selbar"><span class="lab">選択中：</span>${chosen.length?chosen.map(c=>`<span class="tag">${esc(c)}</span>`).join(''):'<span class="lab">なし</span>'}</div>`;
  if(!chosen.length){ $('#cond-out').innerHTML=html+`<div class="empty">左の一覧から持病・年齢・妊娠などを選ぶと、使えない成分と相談が必要な成分がここに並びます。</div>`; return;}
  if(!hits.length){ $('#cond-out').innerHTML=html+`<div class="empty">選んだ条件に該当する記載は別表にありません。</div>`; return;}
  // 成分ごとに集約
  const agg=new Map();
  hits.forEach(({r,h})=>r.it.forEach(i=>{
    const k=i; const cur=agg.get(k)||{lv:r.lv,via:new Set(),note:''};
    if(r.lv==='ng') cur.lv='ng'; h.via.forEach(v=>cur.via.add(v)); if(h.note) cur.note=h.note; agg.set(k,cur);
  }));
  const rows=[...agg.entries()].sort((a,b)=>(a[1].lv===b[1].lv?0:a[1].lv==='ng'?-1:1));
  html+=`<div class="count"><span>${badge('ng')} <b>${ng.length}</b>項目</span><span>${badge('sd')} <b>${sd.length}</b>項目</span><span class="lab">／該当する成分・製品 <b>${rows.length}</b></span></div>`;
  html+=`<h2 class="sec-title">該当する成分・製品の一覧</h2><p class="hintline" style="margin:-10px 0 0">› の付いた成分を押すと、成分カード（作用・配合先・注意）が開きます。</p><div class="tblwrap"><table class="agg"><thead><tr><th>区分</th><th>成分・薬効群</th><th>該当した条件</th></tr></thead><tbody>${
    rows.map(([k,v])=>`<tr><td class="lv">${badge(v.lv)}</td><td>${cardsFor(k).length?`<button class="alink" data-it="${esc(k)}">${esc(k)}</button>`:esc(k)}</td><td class="vc">${[...v.via].map(esc).join('、')}${v.note?`<br><span class="note">${esc(v.note)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`;
  if(ng.length) html+=`<div class="box ng"><h2>してはいけないこと <span>次の人は使用（服用）しないこと 等</span></h2>${ng.map(x=>ruleCard(x.r,x.h)).join('')}</div>`;
  if(sd.length) html+=`<div class="box sd"><h2>相談すること <span>使用前に医師・薬剤師・登録販売者に相談</span></h2>${sd.map(x=>ruleCard(x.r,x.h)).join('')}</div>`;
  $('#cond-out').innerHTML=html;
}
$('#picker').addEventListener('click',e=>{
  if(e.target.id==='clear'){sel.clear();age=null;renderPicker();renderCond();return;}
  const b=e.target.closest('.chip'); if(!b) return; const id=b.dataset.id;
  if(b.dataset.g==='age'){ age = age===id?null:id; }
  else if(PREG_STAGE.includes(id)){ const on=sel.has(id); PREG_STAGE.forEach(x=>sel.delete(x)); if(!on) sel.add(id); }
  else { sel.has(id)?sel.delete(id):sel.add(id); }
  renderPicker(); renderCond();
  const nb=document.getElementById('c-'+id); if(nb) nb.focus();
});

/* ===== Tab 2: 成分から探す ===== */
let curKey='プソイドエフェドリン';
function renderKeys(){
  $('#keys').innerHTML=KEYS.map(([t,...ks])=>`<div class="kh">${t}</div><div class="keys">${ks.map(k=>`<button class="ikey" data-k="${k}" aria-pressed="${k===curKey}">${k}</button>`).join('')}</div>`).join('');
}
function hl(s,terms){ let out=esc(s); terms.forEach(t=>{ if(!t) return; out=out.split(esc(t)).join(`<mark>${esc(t)}</mark>`);}); return out; }
function renderIngr(){
  const q=curKey.trim();
  if(!q){ $('#ingr-out').innerHTML=`<div class="empty">成分名を入力するか、左の候補を押してください。</div>`; return; }
  const classes=CLASS.filter(c=>c.members.some(m=>q.includes(m)||m.includes(q)) && !c.words.some(w=>q.includes(w)));
  const direct=[], viaClass=[];
  RULES.forEach(r=>{
    const text=r.it.join('／');
    if(text.includes(q)) direct.push(r);
    else { const c=classes.find(c=>c.words.some(w=>text.includes(w))); if(c) viaClass.push({r,c}); }
  });
  const inter=INTER.filter(x=>x.why.includes(q));
  let html=`<div class="selbar"><span class="lab">検索：</span><span class="tag">${esc(q)}</span>${classes.length?`<span class="lab">（分類：${classes.map(c=>esc(c.name)).join('、')}）</span>`:''}</div>`;
  const total=direct.length+viaClass.length+inter.length;
  if(!total){ $('#ingr-out').innerHTML=html+`<div class="empty">「${esc(q)}」を含む記載は別表・相互作用データにありません。表記ゆれ（塩酸塩などを省く）を試してください。</div>`; return; }
  const ng=direct.filter(r=>r.lv==='ng'), sd=direct.filter(r=>r.lv==='sd');
  const card=(r,terms,extra='')=>`<div class="rule">${extra}<div class="cond">「${esc(r.cond)}」</div>${r.c||r.age?`<div class="via">対象：${[...(r.c||[]).map(x=>CHIP[x].label),...(r.age?[AGE_LABEL[r.age]]:[])].map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div>`:''}<div class="items">${r.it.map(i=>itemHTML(i,hl(i,terms))).join('')}</div><div class="why">${esc(r.why)}</div><div class="src">${srcText(r)}</div></div>`;
  html+=`<div class="count"><span>${badge('ng')} <b>${ng.length+viaClass.filter(x=>x.r.lv==='ng').length}</b></span><span>${badge('sd')} <b>${sd.length+viaClass.filter(x=>x.r.lv==='sd').length}</b></span><span>${badge('ct')} <b>${inter.length}</b></span></div>`;
  if(ng.length) html+=`<div class="box ng"><h2>してはいけないこと</h2>${ng.map(r=>card(r,[q])).join('')}</div>`;
  if(sd.length) html+=`<div class="box sd"><h2>相談すること</h2>${sd.map(r=>card(r,[q])).join('')}</div>`;
  if(viaClass.length) html+=`<h2 class="sec-title">分類名で記載されているもの（「${esc(q)}」も含まれる）</h2>`+
    ['ng','sd'].map(lv=>{const xs=viaClass.filter(x=>x.r.lv===lv); return xs.length?`<div class="box ${lv}"><h2>${LV[lv]}<span>${esc([...new Set(xs.map(x=>x.c.name))].join('、'))}として</span></h2>${xs.map(x=>card(x.r,x.c.words)).join('')}</div>`:'';}).join('');
  if(inter.length) html+=`<div class="box ct"><h2>飲み合わせの記載</h2>${inter.map(x=>`<div class="rule"><div class="pair"><span class="p">${esc(DRUG[x.a])}</span><span class="x">×</span>${x.b.map(b=>`<span class="p">${esc(DRUG[b])}</span>`).join('<span class="x">／</span>')}</div><div class="why">${hl(x.why,[q])}</div><div class="src">${esc(x.src)}</div></div>`).join('')}</div>`;
  $('#ingr-out').innerHTML=html;
}
$('#keys').addEventListener('click',e=>{const b=e.target.closest('.ikey'); if(!b) return; curKey=b.dataset.k; $('#q').value=curKey; renderKeys(); renderIngr();});
$('#q').addEventListener('input',e=>{curKey=e.target.value.trim(); renderKeys(); renderIngr();});

/* ===== Tab 3: 飲み合わせ ===== */
const csel=new Set(['cold','motion','alcohol']);
function renderComboPicker(){
  $('#combo-picker').innerHTML=`<p class="hint" style="margin:0;font-size:12.5px;color:var(--muted)">同時に使う薬・飲食を2つ以上選ぶと、組み合わせの注意を表示します。1つだけ選ぶと、その薬と注意が必要な相手を一覧します。</p>`+
   DRUG_GROUPS.map(g=>`<div class="grp"><h3>${g.t}</h3><div class="chips">${g.d.map(([id,l])=>`<button class="chip" id="d-${id}" data-id="${id}" aria-pressed="${csel.has(id)}">${esc(l)}</button>`).join('')}</div></div>`).join('')+
   `<div><button class="btn" id="cclear">選択をすべて解除</button></div>`;
}
function pairsOf(x){ const out=[]; INTER.forEach(it=>{ if(it.a===x) it.b.forEach(b=>out.push({it,o:b})); else if(it.b.includes(x)) out.push({it,o:it.a}); }); return out; }
function renderCombo(){
  const s=[...csel]; let html=`<div class="selbar"><span class="lab">選択中：</span>${s.length?s.map(x=>`<span class="tag">${esc(DRUG[x])}</span>`).join(''):'<span class="lab">なし</span>'}</div>`;
  if(!s.length){ $('#combo-out').innerHTML=html+`<div class="empty">左から薬や飲食物を選んでください。</div>`; return; }
  const order={ng:0,sd:1,ct:2};
  const matched=INTER.filter(it=>csel.has(it.a)).map(it=>({it,on:it.b.filter(b=>b!==it.a&&csel.has(b))})).filter(x=>x.on.length).sort((a,b)=>order[a.it.lv]-order[b.it.lv]);
  const pairCard=(it,on)=>`<div class="rule"><div class="pair"><span class="p on">${esc(DRUG[it.a])}</span><span class="x">×</span>${it.b.map(b=>`<span class="p${on.includes(b)?' on':''}">${b===it.a?'同じ種類の別の薬':esc(DRUG[b])}</span>`).join('<span class="x">／</span>')}</div><div class="why" style="">${esc(it.why)}</div><div class="src">${esc(it.src)}</div></div>`;
  if(matched.length){
    html+=`<h2 class="sec-title">選んだ組み合わせで該当</h2>`;
    ['ng','sd','ct'].forEach(lv=>{const xs=matched.filter(x=>x.it.lv===lv); if(xs.length) html+=`<div class="box ${lv}"><h2>${lv==='ng'?'してはいけないこと':lv==='sd'?'相談すること':'併用を避ける・注意（第3章）'}</h2>${xs.map(x=>pairCard(x.it,x.on)).join('')}</div>`;});
  } else html+=`<div class="empty">選んだ組み合わせには、手引きの別表・第3章【相互作用】に記載された注意はありません。</div>`;
  // 各選択の相手一覧
  html+=`<h2 class="sec-title">選んだものと注意が必要な相手（全体）</h2><div class="tblwrap"><table class="agg"><thead><tr><th>区分</th><th>選んだもの</th><th>注意が必要な相手</th></tr></thead><tbody>${
    s.flatMap(x=>{ const m=new Map(); pairsOf(x).forEach(({it,o})=>{ const k=o===x?'同じ種類の別の薬':DRUG[o]; const cur=m.get(k); if(!cur||order[it.lv]<order[cur]) m.set(k,it.lv); });
      return [...m.entries()].sort((a,b)=>order[a[1]]-order[b[1]]).map(([k,lv])=>`<tr><td class="lv">${badge(lv)}</td><td>${esc(DRUG[x])}</td><td>${esc(k)}</td></tr>`);}).join('')||'<tr><td colspan="3" class="vc">記載なし</td></tr>'
  }</tbody></table></div>`;
  $('#combo-out').innerHTML=html;
}
$('#combo-picker').addEventListener('click',e=>{
  if(e.target.id==='cclear'){csel.clear();renderComboPicker();renderCombo();return;}
  const b=e.target.closest('.chip'); if(!b) return; const id=b.dataset.id; csel.has(id)?csel.delete(id):csel.add(id);
  renderComboPicker(); renderCombo(); const nb=document.getElementById('d-'+id); if(nb) nb.focus();
});


/* ===== スマホ：結果へのジャンプバー ===== */
const narrow=()=>window.matchMedia('(max-width:860px)').matches;
let curTab='cond'; const OUT={cond:'#cond-out',ingr:'#ingr-out',combo:'#combo-out'};
let outVisible=false;
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.target===$(OUT[curTab])) {outVisible=e.isIntersecting; updateJump();}})},{rootMargin:'0px 0px -40% 0px'}):null;
function updateJump(){
  const out=$(OUT[curTab]); const bar=$('#jump');
  const n=out.querySelectorAll('.box.ng .rule').length, sd=out.querySelectorAll('.box.sd .rule').length, ct=out.querySelectorAll('.box.ct .rule').length;
  const has=!out.querySelector('.empty')||n+sd+ct>0;
  $('#jump-sum').innerHTML=(n+sd+ct)?`<span class="n">使用しない <b>${n}</b></span><span class="s">相談 <b>${sd}</b></span>${ct?`<span>注意 <b>${ct}</b></span>`:''}`:'<span>該当なし</span>';
  bar.hidden=!narrow()||outVisible||!has&&!(n+sd+ct);
}
function watch(){ if(!io) return; io.disconnect(); io.observe($(OUT[curTab])); }
$('#jump-btn').addEventListener('click',()=>$(OUT[curTab]).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
window.addEventListener('resize',updateJump);
['#picker','#combo-picker','#keys'].forEach(sel=>$(sel).addEventListener('click',()=>setTimeout(updateJump,0)));
$('#q').addEventListener('input',()=>setTimeout(updateJump,0));
// 成分の候補を押したら、スマホでは結果まで移動
$('#keys').addEventListener('click',e=>{ if(e.target.closest('.ikey') && narrow()) setTimeout(()=>$('#ingr-out').scrollIntoView({behavior:'smooth',block:'start'}),0); });

/* ===== tabs ===== */
const TABS=['cond','ingr','combo'];
function show(t){ if(!TABS.includes(t)) t='cond'; curTab=t; outVisible=false; setTimeout(()=>{watch();updateJump();},0);
  TABS.forEach(x=>{ $('#v-'+x).hidden = x!==t; $('#t-'+x).setAttribute('aria-selected', x===t); }); }
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; const t=b.dataset.tab; if(location.hash!=='#'+t) location.hash=t; show(t);});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

renderPicker(); renderCond(); $('#q').value=curKey; renderKeys(); renderIngr(); renderComboPicker(); renderCombo();
show(location.hash.slice(1));
</script>

</body>
