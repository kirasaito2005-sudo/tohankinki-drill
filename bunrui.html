<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登販 成分分類表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: 添付文書のような読みやすさ。左に薬効群の索引、右に「分類 → 成分表」。上部に常時検索。 */
:root {
  --bg: #f6f7f5;
  --paper: #ffffff;
  --ink: #1d2421;
  --muted: #5d6963;
  --line: #d9dfdb;
  --line-soft: #e8ece9;
  --accent: #0f6b5c;        /* 薬袋のような深い緑 */
  --accent-soft: #e2f0ec;
  --warn: #a8321f;          /* 添付文書の「してはいけないこと」の赤 */
  --warn-soft: #fbece8;
  --mark: #fff0a8;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --paper: #1a201e; --ink: #e4ebe7; --muted: #9aa8a1;
    --line: #2f3935; --line-soft: #252d2a; --accent: #5cc3ab; --accent-soft: #1d3530;
    --warn: #f08a76; --warn-soft: #3a221d; --mark: #5a4f12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --paper: #1a201e; --ink: #e4ebe7; --muted: #9aa8a1;
  --line: #2f3935; --line-soft: #252d2a; --accent: #5cc3ab; --accent-soft: #1d3530;
  --warn: #f08a76; --warn-soft: #3a221d; --mark: #5a4f12; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.7;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.top-inner { max-width: 1240px; margin: 0 auto; display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
.home { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
.home:hover { text-decoration: underline; }
.brand small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.search { flex: 1 1 320px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.search-box { position: relative; flex: 1; min-width: 0; }
.search-box input {
  width: 100%; font: inherit; font-size: 15px; padding: 9px 36px 9px 12px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
.search-box input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.search-box input:focus { outline: none; border-color: var(--accent); background: var(--paper); }
.search-box button {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1;
}
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.tabs { max-width: 1240px; margin: 10px auto 0; display: flex; gap: 4px; }
.tab {
  font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.tab:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- layout ---------- */
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start;
}
nav.index {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 128px);
  max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 4px;
  font-size: 13.5px;
}
.ch-label { font-size: 11.5px; color: var(--muted); letter-spacing: .08em; margin: 14px 0 4px; font-weight: 700; }
.ch-label:first-child { margin-top: 0; }
.ch-label .num { font-family: var(--f-mono); color: var(--accent); margin-right: 4px; letter-spacing: 0; }
.grp-btn {
  display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
  font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 6px;
  padding: 5px 8px; cursor: pointer; line-height: 1.45;
}
.grp-btn:hover { background: var(--line-soft); }
.grp-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.grp-btn .cnt { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.mobile-pick { display: none; }

main { min-width: 0; }
.g-head { margin-bottom: 18px; }
.g-ch { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.g-ch .id { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.g-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.35; margin: 2px 0 6px; text-wrap: balance; }
.g-desc { color: var(--muted); max-width: 68ch; margin: 0; }
.cls-jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.cls-jump a {
  font-size: 12.5px; text-decoration: none; color: var(--accent); border: 1px solid var(--line);
  background: var(--paper); padding: 3px 10px; border-radius: 999px;
}
.cls-jump a:hover { border-color: var(--accent); }

/* ---------- class block ---------- */
.cls {
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  margin-bottom: 16px; overflow: hidden; scroll-margin-top: 150px;
}
.cls-head { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.cls-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.cls-title h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--accent); }
.cls-title .act { font-size: 13.5px; color: var(--ink); }
.cls-title .act::before { content: "→ "; color: var(--muted); }
.cls-note {
  margin: 8px 0 0; font-size: 13px; line-height: 1.65; color: var(--warn);
  background: var(--warn-soft); border-radius: 6px; padding: 6px 10px;
}
.cls-from { font-size: 12px; color: var(--muted); }
.cls-from a { color: var(--accent); }

table.items { width: 100%; border-collapse: collapse; font-size: 14px; }
table.items th {
  text-align: left; font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 700;
  padding: 7px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
table.items td { padding: 10px 16px; vertical-align: top; border-bottom: 1px solid var(--line-soft); line-height: 1.65; }
table.items tr:last-child td { border-bottom: 0; }
td.n { font-weight: 700; width: 28%; }
td.e { width: 38%; }
td.c { color: var(--warn); font-size: 13px; }
td.c strong { font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
td.c:empty::before { content: "—"; color: var(--line); }
body.hide-caution td.c, body.hide-caution th.c, body.hide-caution .cls-note { display: none; }
body.hide-caution td.n { width: 35%; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- 分類から探す ---------- */
.cat-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 22px; }
.cat {
  font: inherit; font-size: 13.5px; cursor: pointer; border: 1px solid var(--line); background: var(--paper);
  color: var(--ink); border-radius: 8px; padding: 6px 12px; display: inline-flex; gap: 8px; align-items: baseline;
}
.cat:hover { border-color: var(--accent); }
.cat[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.cat .cnt { font-family: var(--f-mono); font-size: 11px; opacity: .75; }
.sect-label { font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 700; margin: 0 0 8px; }

.empty { padding: 40px 0; color: var(--muted); }
.res-sum { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.res-group { font-family: var(--f-display); font-weight: 800; font-size: 19px; margin: 22px 0 8px; }
.res-group:first-of-type { margin-top: 0; }
.res-group .id { font-family: var(--f-mono); font-size: 12px; color: var(--accent); margin-right: 6px; font-weight: 500; }

footer { grid-column: 1 / -1; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 10px; }

/* ---------- narrow ---------- */
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 14px 48px; }
  nav.index { display: none; }
  .mobile-pick { display: block; margin-bottom: 14px; }
  .mobile-pick select {
    width: 100%; font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 8px;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .g-head h2 { font-size: 23px; }
  .cls { scroll-margin-top: 170px; }
  table.items thead { display: none; }
  table.items, table.items tbody, table.items tr, table.items td { display: block; width: 100% !important; }
  table.items tr { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
  table.items tr:last-child { border-bottom: 0; }
  table.items td { padding: 0; border: 0; }
  td.n { font-size: 15px; }
  td.e { margin-top: 2px; }
  td.c { margin-top: 6px; }
  td.c:empty { display: none; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><a class="home" href="index.html">← ホーム</a><h1>登販 成分分類表</h1><small>手引き 第3章（令和8年4月一部改訂）準拠</small></div>
    <div class="search">
      <div class="search-box">
        <input id="q" type="search" placeholder="成分名・分類・効能で検索（例：抗ヒスタミン、緑内障、カンゾウ）" autocomplete="off" aria-label="検索">
        <button id="qclear" type="button" aria-label="検索をクリア" hidden>×</button>
      </div>
      <label class="toggle"><input id="caution" type="checkbox" checked> 注意点</label>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-group" aria-selected="true">薬効群から見る</button>
    <button class="tab" role="tab" id="tab-cat" aria-selected="false">分類から横断</button>
  </div>
</header>

<div class="wrap">
  <nav class="index" id="index" aria-label="薬効群"></nav>
  <main id="main"></main>
  <footer>
    出典：厚生労働省「試験問題の作成に関する手引き（令和8年4月一部改訂）」第3章 主な医薬品とその作用。内容を表形式に要約したもので、原文の表現を短くしている箇所があります。ⅩⅥ 一般用検査薬は成分分類がないため収録していません。
  </footer>
</div>

<script>
// 出典: 試験問題の作成に関する手引き（令和８年４月一部改訂）第３章
// 形式: {ch, id, name, desc, classes:[{cls, act, items:[[成分名, はたらき・効能, 主な注意点], ...]}]}
window.DATA = window.DATA || [];
DATA.push(
{
  ch: "Ⅰ 精神神経に作用する薬", id: "1-1", name: "かぜ薬",
  desc: "かぜの諸症状（発熱・頭痛・くしゃみ・鼻水・咳・痰など）を緩和する対症療法薬。ウイルスを除去するものではない。",
  classes: [
    { cls: "解熱鎮痛成分", act: "発熱を鎮め、痛みを和らげる", items: [
      ["アスピリン", "解熱・鎮痛（詳細はⅠ-2 解熱鎮痛薬）", "15歳未満はいかなる場合も使用しない"],
      ["サリチルアミド、エテンザミド", "解熱・鎮痛", "水痘・インフルエンザにかかっている15歳未満は使用を避ける"],
      ["アセトアミノフェン", "解熱・鎮痛（主に中枢作用）", "インフルエンザ流行期などは、アセトアミノフェンや生薬成分のみの製品を提案する対応が重要"],
      ["イブプロフェン", "解熱・鎮痛・抗炎症", "15歳未満はいかなる場合も使用しない"],
      ["イソプロピルアンチピリン", "解熱・鎮痛", "ピリン系"],
      ["ジリュウ（生薬）", "解熱", ""],
      ["ショウキョウ、ケイヒ（生薬）", "他の解熱鎮痛成分と組み合わせて配合", ""],
      ["ゴオウ、カッコン、サイコ、ボウフウ、ショウマ（生薬）", "解熱作用を期待", ""],
      ["センキュウ、コウブシ（生薬）", "鎮痛作用を期待", ""]
    ]},
    { cls: "抗ヒスタミン成分", act: "くしゃみや鼻汁を抑える", items: [
      ["クロルフェニラミンマレイン酸塩、カルビノキサミンマレイン酸塩、メキタジン、クレマスチンフマル酸塩、ジフェンヒドラミン塩酸塩 等", "くしゃみ・鼻汁を抑える（詳細はⅦ 内服アレルギー用薬）", "眠気・口渇、排尿困難"]
    ]},
    { cls: "抗コリン成分", act: "鼻汁分泌やくしゃみを抑える", items: [
      ["ベラドンナ総アルカロイド、ヨウ化イソプロパミド", "抗コリン作用で鼻汁分泌・くしゃみを抑える（詳細はⅦ）", "排尿困難"]
    ]},
    { cls: "アドレナリン作動成分", act: "鼻粘膜の充血を和らげ、気管・気管支を拡げる", items: [
      ["メチルエフェドリン塩酸塩、メチルエフェドリンサッカリン塩", "鼻粘膜の充血を和らげ、気管支を拡げる（詳細はⅡ-1）", "依存性あり"],
      ["プソイドエフェドリン塩酸塩", "鼻粘膜の充血を和らげる（詳細はⅦ）", "依存性あり"],
      ["マオウ（生薬）", "同様の作用", "依存性あり"]
    ]},
    { cls: "鎮咳成分", act: "咳を抑える", items: [
      ["コデインリン酸塩水和物、ジヒドロコデインリン酸塩", "咳を抑える（詳細はⅡ-1）", "依存性あり。12歳未満は使用禁忌。便秘"],
      ["デキストロメトルファン臭化水素酸塩水和物、ノスカピン、チペピジンヒベンズ酸塩、クロペラスチン塩酸塩 等", "咳を抑える", ""],
      ["ナンテンジツ 等（生薬）", "鎮咳作用", ""]
    ]},
    { cls: "去痰成分", act: "痰の切れを良くする", items: [
      ["グアイフェネシン、グアヤコールスルホン酸カリウム、ブロムヘキシン塩酸塩、エチルシステイン塩酸塩 等", "痰の切れを良くする（詳細はⅡ-1）", ""],
      ["シャゼンソウ、セネガ、キキョウ、セキサン、オウヒ 等（生薬）", "去痰作用", ""]
    ]},
    { cls: "抗炎症成分", act: "鼻粘膜や喉の炎症による腫れを和らげる", items: [
      ["トラネキサム酸", "体内での起炎物質の産生を抑制して炎症の発生を抑え、腫れを和らげる", "凝固した血液を溶解されにくくするため、血栓のある人（脳血栓・心筋梗塞・血栓性静脈炎等）や血栓を起こすおそれのある人は医師等に相談"],
      ["グリチルリチン酸二カリウム", "作用本体のグリチルリチン酸がステロイド性抗炎症成分に化学構造が類似し、抗炎症作用を示す", "大量摂取で偽アルドステロン症。むくみ・心臓病・腎臓病・高血圧の人や高齢者で1日最大服用量がグリチルリチン酸40mg以上の製品は医師等に相談。40mg以上の製品は長期連用を避ける。医薬品では1日200mgを超えない"],
      ["カンゾウ（生薬）", "グリチルリチン酸を含む（詳細はⅡ-1）", "偽アルドステロン症"],
      ["カミツレ（生薬）", "発汗・抗炎症等", ""]
    ]},
    { cls: "鎮静成分", act: "解熱鎮痛成分の鎮痛作用を補助", items: [
      ["ブロモバレリル尿素、アリルイソプロピルアセチル尿素", "鎮痛作用の補助（詳細はⅠ-3）", "依存性あり"]
    ]},
    { cls: "制酸成分", act: "胃酸を中和（解熱鎮痛成分による胃腸障害の軽減）", items: [
      ["ケイ酸アルミニウム、酸化マグネシウム、水酸化アルミニウムゲル 等", "解熱鎮痛成分による胃腸障害の軽減（詳細はⅢ-1）", "胃腸症状への薬効を標榜することは認められていない"]
    ]},
    { cls: "カフェイン類", act: "解熱鎮痛成分の鎮痛作用を補助", items: [
      ["カフェイン、無水カフェイン、安息香酸ナトリウムカフェイン 等", "鎮痛作用の補助（詳細はⅠ-4）", "配合されていても抗ヒスタミン成分や鎮静成分による眠気が解消されるわけではない"]
    ]},
    { cls: "ビタミン成分等", act: "かぜの時に消耗しやすいビタミン等の補給", items: [
      ["ビタミンC（アスコルビン酸 等）、ビタミンB2（リボフラビン 等）、ヘスペリジン", "粘膜の健康維持・回復", ""],
      ["ビタミンB1（チアミン硝化物、フルスルチアミン塩酸塩 等）、アミノエチルスルホン酸（タウリン）", "疲労回復", ""],
      ["ニンジン、チクセツニンジン（生薬）", "強壮作用等", ""]
    ]},
    { cls: "漢方処方製剤", act: "かぜの症状緩和", note: "半夏厚朴湯以外はカンゾウを含む。麻黄湯・葛根湯・小青竜湯はマオウを含む。", items: [

},
{

  desc: "手指・皮膚の消毒や、器具・設備等の殺菌・消毒に用いる薬。",
  classes: [
    { cls: "手指・皮膚・器具の殺菌消毒成分", act: "手指・皮膚の消毒のほか、器具等の殺菌・消毒", items: [
      ["クレゾール石ケン液", "結核菌を含む一般細菌類、真菌類に比較的広い殺菌消毒作用", "大部分のウイルスには効果がない。刺激性が強く原液が直接皮膚に付着しないようにする"],
      ["ポリアルキルポリアミノエチルグリシン塩酸塩、ポリオキシエチレンアルキルフェニルエーテル", "クレゾール石ケン液と同様の殺菌消毒作用", ""],
      ["エタノール、イソプロパノール", "微生物のタンパク質を変性させ、結核菌を含む一般細菌類、真菌類、ウイルスに殺菌消毒作用", "イソプロパノールはウイルスへの効果がエタノールより低い。脱脂による肌荒れ。粘膜面・目の周り・傷には使用を避ける。引火しやすい"],
      ["クロルヘキシジングルコン酸塩", "一般細菌類、真菌類に殺菌消毒作用（Ⅹ参照）", "結核菌・ウイルスには効果がない"]
    ]},
    { cls: "器具・設備等の殺菌消毒成分", act: "専ら器具、設備等の殺菌・消毒", items: [
      ["次亜塩素酸ナトリウム、サラシ粉（塩素系）", "強い酸化力により一般細菌類、真菌類、ウイルス全般に殺菌消毒作用。吐瀉物や血液の消毒にも適す", "皮膚刺激性が強く人体には通常用いない。金属腐食性、プラスチック・ゴムを劣化、漂白作用。酸性洗剤と混ぜると塩素ガス"],
      ["ジクロロイソシアヌル酸ナトリウム、トリクロロイソシアヌル酸（有機塩素系）", "塩素臭・刺激性・金属腐食性が比較的抑えられ、プール等の大型設備の殺菌・消毒に", ""]
    ]}
  ]
},
{
  ch: "ⅩⅤ 公衆衛生用薬", id: "15-2", name: "殺虫剤・忌避剤",
  desc: "ハエ・蚊・ゴキブリ・ダニ等の衛生害虫の防除に用いる殺虫剤と、虫が人体に取り付くのを防ぐ忌避剤。同じ殺虫成分を長期連用せず順番に使うのが望ましい。",
  classes: [
    { cls: "有機リン系殺虫成分", act: "アセチルコリンエステラーゼと不可逆的に結合して働きを阻害", items: [
      ["ジクロルボス、ダイアジノン、フェニトロチオン、フェンチオン、トリクロルホン、クロルピリホスメチル、プロペタンホス 等", "殺虫（ほ乳類や鳥類では速やかに分解されるため毒性は比較的低い）", "高濃度・多量曝露で縮瞳、呼吸困難、筋肉麻痺等→直ちに受診"]
    ]},
    { cls: "ピレスロイド系殺虫成分", act: "神経細胞に直接作用して神経伝達を阻害", items: [
      ["ペルメトリン、フタルスリン 等", "除虫菊の成分から開発。速やかに自然分解し残効性が低く、家庭用殺虫剤に広く使用", ""],
      ["フェノトリン", "殺虫成分で唯一人体に直接適用（シラミ駆除のシャンプー・てんか粉）", "シラミの刺咬による痒みや腫れを和らげる作用はない"]
    ]},
    { cls: "カーバメイト系・オキサジアゾール系殺虫成分", act: "アセチルコリンエステラーゼを可逆的に阻害", items: [
      ["プロポクスル（カーバメイト系）、メトキサジアゾン（オキサジアゾール系）", "ピレスロイド系に抵抗性を示す害虫の駆除。一般に有機リン系より毒性は低い", ""]
    ]},
    { cls: "有機塩素系殺虫成分", act: "神経細胞に対する作用", items: [
      ["オルトジクロロベンゼン", "ウジ、ボウフラの防除（DDT等は残留性・体内蓄積性の問題で現在は使われていない）", ""]
    ]},
    { cls: "昆虫成長阻害成分", act: "昆虫の脱皮や変態を阻害（有機リン系・ピレスロイド系に抵抗性がある場合も有効）", items: [
      ["メトプレン、ピリプロキシフェン", "幼若ホルモンに類似した作用で、幼虫が蛹になるのを妨げる", "蛹にならない不完全変態の昆虫やダニには無効"],
      ["ジフルベンズロン", "脱皮時の新しい外殻の形成を阻害", ""]
    ]},
    { cls: "殺虫補助成分", act: "殺虫成分とともに配合して殺虫効果を高める", items: [
      ["ピペニルブトキシド（PBO）、チオシアノ酢酸イソボルニル（IBTA）", "殺虫効果を高める（それ自体の殺虫作用は弱いかほとんどない）", ""]
    ]},
    { cls: "忌避成分", act: "虫が人体に取り付いて吸血したり病原細菌等を媒介するのを防止", items: [
      ["ディート", "最も効果的で、効果の持続性も高い", "虫さされの痒みや腫れを和らげる効果はない"],
      ["イカリジン", "年齢による使用制限がない。蚊やマダニなどに効果", ""]
    ]}
  ]
}
);

</script>
<script>
(function () {
  const D = window.DATA;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const baseCls = c => { const m = c.match(/^(.*?)（([^）]*)）$/); const k = m ? (/成分$/.test(m[2]) ? m[2] : m[1]) : c; return k.replace(/等$/, "").trim(); };
  const romanOf = ch => ch.split(" ")[0];
  const chName = ch => ch.split(" ").slice(1).join(" ");

  // ---- state ----
  let mode = "group", current = D[0].id, cat = null, query = "";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const countItems = g => g.classes.reduce((a, c) => a + c.items.length, 0);

  // ---- normalise for search (全角英数・カナ揺れを軽く吸収) ----
  const norm = s => String(s).replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).toLowerCase().replace(/[ぁ-ゖ]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));

  function highlight(text, q) {
    const t = esc(text);
    if (!q) return t;
    const nt = norm(text), nq = norm(q);
    const idx = [];
    let from = 0, i;
    while (nq && (i = nt.indexOf(nq, from)) !== -1) { idx.push(i); from = i + nq.length; }
    if (!idx.length || nt.length !== text.length) return t;
    let out = "", last = 0;
    idx.forEach(i => { out += esc(text.slice(last, i)) + "<mark>" + esc(text.slice(i, i + nq.length)) + "</mark>"; last = i + nq.length; });
    return out + esc(text.slice(last));
  }
  const STRONG = /(いかなる場合も使用しない|使用を避ける|服用を避ける|使用しない|服用しない|使用禁忌|禁忌|授乳を避ける|連用を避ける|長期連用を避ける)/g;
  function caution(text, q) {
    let h = highlight(text, q);
    if (!/<mark>/.test(h)) h = h.replace(STRONG, "<strong>$1</strong>");
    return h;
  }

  // ---- index (sidebar + mobile select) ----
  function buildIndex() {
    const nav = $("#index");
    let html = "", lastCh = "";
    let opts = "";
    D.forEach(g => {
      if (g.ch !== lastCh) {
        html += `<div class="ch-label"><span class="num">${esc(romanOf(g.ch))}</span>${esc(chName(g.ch))}</div>`;
        if (lastCh) opts += "</optgroup>";
        opts += `<optgroup label="${esc(g.ch)}">`;
        lastCh = g.ch;
      }
      html += `<button class="grp-btn" data-g="${g.id}"><span>${esc(g.name)}</span><span class="cnt">${countItems(g)}</span></button>`;
      opts += `<option value="${g.id}">${esc(g.name)}</option>`;
    });
    opts += "</optgroup>";
    nav.innerHTML = html;
    nav.addEventListener("click", e => {
      const b = e.target.closest(".grp-btn"); if (!b) return;
      selectGroup(b.dataset.g, true);
    });
    const pick = document.createElement("div");
    pick.className = "mobile-pick";
    pick.innerHTML = `<select id="gsel" aria-label="薬効群を選ぶ">${opts}</select>`;
    $("#main").before(pick);
    $("#gsel").addEventListener("change", e => selectGroup(e.target.value, true));
  }

  function rowsHTML(items, q) {
    return items.map(([n, e, c]) =>
      `<tr><td class="n">${highlight(n, q)}</td><td class="e">${highlight(e, q)}</td><td class="c">${c ? caution(c, q) : ""}</td></tr>`
    ).join("");
  }
  function clsHTML(c, q, opts = {}) {
    const anchor = opts.anchor ? ` id="${opts.anchor}"` : "";
    const from = opts.from ? `<div class="cls-from">${opts.from}</div>` : "";
    return `<section class="cls"${anchor}>
      <div class="cls-head">
        ${from}
        <div class="cls-title"><h3>${highlight(c.cls, q)}</h3><span class="act">${highlight(c.act, q)}</span></div>
        ${c.note ? `<p class="cls-note">${caution(c.note, q)}</p>` : ""}
      </div>
      <table class="items">
        <thead><tr><th>成分名</th><th>はたらき・効能</th><th class="c">主な注意点</th></tr></thead>
        <tbody>${rowsHTML(c.items, q)}</tbody>
      </table>
    </section>`;
  }

  // ---- views ----
  function renderGroup() {
    const g = D.find(x => x.id === current) || D[0];
    const jumps = g.classes.map((c, i) => `<a href="#c-${g.id}-${i}" data-jump="c-${g.id}-${i}">${esc(c.cls)}</a>`).join("");
    $("#main").innerHTML = `
      <div class="g-head">
        <div class="g-ch"><span class="id">${esc(g.id)}</span>${esc(g.ch)}</div>
        <h2>${esc(g.name)}</h2>
        <p class="g-desc">${esc(g.desc)}</p>
        <div class="cls-jump">${jumps}</div>
      </div>
      ${g.classes.map((c, i) => clsHTML(c, "", { anchor: `c-${g.id}-${i}` })).join("")}`;
    document.querySelectorAll(".grp-btn").forEach(b => b.setAttribute("aria-current", b.dataset.g === g.id ? "true" : "false"));
    const sel = $("#gsel"); if (sel) sel.value = g.id;
  }

  function catList() {
    const m = new Map();
    D.forEach(g => g.classes.forEach(c => {
      const k = baseCls(c.cls);
      if (!m.has(k)) m.set(k, { groups: new Set(), n: 0 });
      const v = m.get(k); v.groups.add(g.id); v.n += c.items.length;
    }));
    return [...m.entries()].filter(([, v]) => v.groups.size >= 2).sort((a, b) => b[1].groups.size - a[1].groups.size || a[0].localeCompare(b[0], "ja"));
  }
  function renderCat() {
    const list = catList();
    if (!cat || !list.some(([k]) => k === cat)) cat = list[0][0];
    const chips = list.map(([k, v]) =>
      `<button class="cat" data-cat="${esc(k)}" aria-pressed="${k === cat}">${esc(k)}<span class="cnt">${v.groups.size}群</span></button>`).join("");
    let body = "";
    D.forEach(g => g.classes.forEach(c => {
      if (baseCls(c.cls) !== cat) return;
      body += clsHTML(c, "", { from: `<a href="#" data-goto="${g.id}">${esc(g.id)} ${esc(g.name)}</a>` });
    }));
    $("#main").innerHTML = `
      <div class="g-head">
        <h2>分類から横断</h2>
        <p class="g-desc">同じ成分分類が複数の薬効群に出てくるものを並べています（2群以上に登場する分類）。分類を選ぶと、その分類が出てくる薬効群の表がまとめて表示されます。</p>
      </div>
      <p class="sect-label">成分分類</p>
      <div class="cat-grid">${chips}</div>
      <p class="sect-label">「${esc(cat)}」が出てくる薬効群</p>
      ${body}`;
  }

  function renderSearch() {
    const q = query.trim(), nq = norm(q);
    let html = "", hitRows = 0, hitGroups = 0;
    D.forEach(g => {
      let gh = "";
      g.classes.forEach(c => {
        const clsHit = norm(c.cls + " " + c.act).includes(nq);
        const noteHit = c.note && norm(c.note).includes(nq);
        const items = clsHit ? c.items : c.items.filter(r => norm(r.join(" ")).includes(nq));
        if (!items.length && !noteHit) return;
        const shown = items.length ? items : c.items;
        hitRows += shown.length;
        gh += clsHTML({ ...c, items: shown }, q);
      });
      if (gh) {
        hitGroups++;
        html += `<h2 class="res-group"><span class="id">${esc(g.id)}</span><a href="#" data-goto="${g.id}" style="color:inherit;text-decoration:none">${esc(g.name)}</a></h2>${gh}`;
      }
    });
    $("#main").innerHTML = html
      ? `<p class="res-sum">「${esc(q)}」：${hitGroups}薬効群・${hitRows}行</p>${html}`
      : `<div class="empty">「${esc(q)}」に一致する成分は見つかりませんでした。成分名の一部（例：「フェニラミン」）や分類名（例：「抗コリン」）でも探せます。</div>`;
  }

  function render() {
    $("#tab-group").setAttribute("aria-selected", mode === "group");
    $("#tab-cat").setAttribute("aria-selected", mode === "cat");
    if (query.trim()) renderSearch();
    else if (mode === "cat") renderCat();
    else renderGroup();
  }

  function selectGroup(id, scrollTop) {
    current = id; mode = "group"; query = ""; $("#q").value = ""; $("#qclear").hidden = true;
    store.set("tohan-group", id);
    render();
    if (scrollTop) window.scrollTo({ top: 0 });
  }

  // ---- events ----
  $("#main").addEventListener("click", e => {
    const go = e.target.closest("[data-goto]");
    if (go) { e.preventDefault(); selectGroup(go.dataset.goto, true); return; }
    const j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ block: "start" }); return; }
    const c = e.target.closest(".cat");
    if (c) { cat = c.dataset.cat; store.set("tohan-cat", cat); render(); }
  });
  let tmr;
  $("#q").addEventListener("input", e => {
    clearTimeout(tmr);
    tmr = setTimeout(() => { query = e.target.value; $("#qclear").hidden = !query; render(); window.scrollTo({ top: 0 }); }, 120);
  });
  $("#qclear").addEventListener("click", () => { query = ""; $("#q").value = ""; $("#qclear").hidden = true; render(); $("#q").focus(); });
  $("#tab-group").addEventListener("click", () => { mode = "group"; query = ""; $("#q").value = ""; $("#qclear").hidden = true; store.set("tohan-mode", mode); render(); });
  $("#tab-cat").addEventListener("click", () => { mode = "cat"; query = ""; $("#q").value = ""; $("#qclear").hidden = true; store.set("tohan-mode", mode); render(); });
  $("#caution").addEventListener("change", e => {
    document.body.classList.toggle("hide-caution", !e.target.checked);
    store.set("tohan-caution", e.target.checked ? "1" : "0");
  });

  // ---- boot ----
  const sg = store.get("tohan-group"); if (sg && D.some(g => g.id === sg)) current = sg;
  const sm = store.get("tohan-mode"); if (sm === "cat") mode = "cat";
  const sc = store.get("tohan-cat"); if (sc) cat = sc;
  if (store.get("tohan-caution") === "0") { $("#caution").checked = false; document.body.classList.add("hide-caution"); }
  buildIndex();
  render();
})();
</script>
