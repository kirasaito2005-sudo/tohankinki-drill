const LS="ranyou8-v1";let S={};try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
/* ---------- sound (Web Audio, all synthesized) ---------- */
const SK="ranyou8-snd";let P={bgm:true,se:true};try{Object.assign(P,JSON.parse(localStorage.getItem(SK))||{})}catch(e){}
let AC=null,seBus,bgmBus,bgmOn=false,nextT=0,step=0,timer=null;
function ctx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    seBus=AC.createGain();seBus.gain.value=.45;seBus.connect(AC.destination);
    bgmBus=AC.createGain();bgmBus.gain.value=.0001;bgmBus.connect(AC.destination)}
  if(AC.state==="suspended")AC.resume();return AC}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type,vol,bus,flat){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  if(flat){g.gain.setValueAtTime(vol,t+d-.03);g.gain.linearRampToValueAtTime(.0001,t+d)}else g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}
function play(kind,rate=1){if(!P.se||!ctx())return;const t=AC.currentTime+.01;
  if(kind==="ok"){ // ピンポーン
    tone(hz(88),t,.45,"sine",.5,seBus);tone(hz(100),t,.3,"sine",.12,seBus);
    tone(hz(84),t+.16,.9,"sine",.5,seBus);tone(hz(96),t+.16,.6,"sine",.12,seBus);
  }else if(kind==="ng"){ // ブッブー
    [[0,.16],[.24,.55]].forEach(([s,d])=>{tone(140,t+s,d,"square",.22,seBus,1);tone(147,t+s,d,"sawtooth",.12,seBus,1)});
  }else if(kind==="tap"){tone(hz(81),t,.06,"triangle",.18,seBus);
  }else if(kind==="end"){ // 成績に応じたジングル
    const seq=rate>=.8?[72,76,79,84]:rate>=.5?[72,76,79]:[67,65,64];
    seq.forEach((m,i)=>tone(hz(m),t+i*.12,i===seq.length-1?.8:.22,"triangle",.35,seBus));
    if(rate>=.8)tone(hz(88),t+.36,.9,"sine",.15,seBus)}
}
// BGM: 4-bar loop C–Am–F–G, 92 BPM, soft arpeggio + bass
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],PAT=[0,2,1,2,3,2,1,2],E8=60/92/2;
function sched(){while(nextT<AC.currentTime+.35){const bar=Math.floor(step/8)%4,i=step%8,c=CH[bar],tn=[c[0],c[1],c[2],c[0]+12];
    tone(hz(tn[PAT[i]]+12),nextT,E8*1.8,"sine",.5,bgmBus);
    if(i===0||i===4)tone(hz(c[0]-12),nextT,E8*3.6,"triangle",.7,bgmBus);
    if(i===0&&bar%2===0)tone(hz(c[2]+12),nextT,E8*7,"sine",.18,bgmBus);
    nextT+=E8;step++}}
function bgmStart(){if(bgmOn||!P.bgm||!ctx())return;bgmOn=true;nextT=AC.currentTime+.1;
  bgmBus.gain.cancelScheduledValues(AC.currentTime);bgmBus.gain.setTargetAtTime(.13,AC.currentTime,.4);
  sched();timer=setInterval(sched,100)}
function bgmStop(){if(!bgmOn)return;bgmOn=false;clearInterval(timer);bgmBus.gain.setTargetAtTime(.0001,AC.currentTime,.15)}
function sndUI(){[["#t-bgm","bgm"],["#t-se","se"]].forEach(([s,k])=>{const b=document.querySelector(s);b.setAttribute("aria-pressed",P[k]);b.title=P[k]?"オフにする":"オンにする"})}
function sndSave(){try{localStorage.setItem(SK,JSON.stringify(P))}catch(e){}}
window.addEventListener("pointerdown",()=>{ctx();if(P.bgm)bgmStart()},{once:true});
window.addEventListener("keydown",()=>{ctx();if(P.bgm)bgmStart()},{once:true});
document.addEventListener("visibilitychange",()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});

const $=s=>document.querySelector(s), shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function acc(ids){let c=0,t=0;ids.forEach(i=>{const r=S[i];if(r){c+=r.c;t+=r.c+r.w}});return t?c/t:0}
function home(){
  const groups=["rule","mix",...Object.keys(D)];
  const weak=Q.map((q,i)=>i).filter(i=>S[i]&&S[i].last===0);
  $("#home").innerHTML=`
   <div class="grid">
     <button class="mode primary" data-m="rand"><b>ランダム10問</b><small>全${Q.length}問から出題</small></button>
     <button class="mode" data-m="all"><b>全問ぶっ通し</b><small>${Q.length}問・シャッフル</small></button>
     <button class="mode" data-m="weak" ${weak.length?"":"disabled"}><b>間違えた問題</b><small>${weak.length?weak.length+"問を復習":"まだありません"}</small></button>
   </div>
   <div class="label">分野・成分別</div>
   <div class="grid">${groups.map(g=>{const ids=Q.map((q,i)=>q[0]===g?i:-1).filter(i=>i>=0);
     return `<button class="mode" data-m="${g}"><b>${T[g]}${D[g]&&D[g].nw?' <span class="new">追加</span>':''}</b><small>${ids.length}問・正答率 ${Math.round(acc(ids)*100)}%</small><span class="bar"><i style="width:${acc(ids)*100}%"></i></span></button>`}).join("")}</div>
   <p class="note">2026年10月時点の制度（令和8年5月1日施行・令和8年厚生労働省告示第32号）と、登録販売者試験の手引きの記載をもとに作成。正答率はこの端末にだけ保存されます。</p>`;
  $("#home").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{play("tap");start(b.dataset.m)});
}
let run;
function start(m){
  let ids=Q.map((q,i)=>i);
  if(m==="rand")ids=shuf(ids).slice(0,10);
  else if(m==="all")ids=shuf(ids);
  else if(m==="weak")ids=shuf(ids.filter(i=>S[i]&&S[i].last===0));
  else ids=shuf(ids.filter(i=>Q[i][0]===m));
  run={ids,k:0,ok:0,miss:[]};show("quiz");ask();
}
function ask(){
  const i=run.ids[run.k],[g,q,ch,ex]=Q[i],opts=shuf(ch.map((t,j)=>({t,ok:j===0})));
  $("#quiz").innerHTML=`<div class="card">
    <div class="meta"><span class="tag">${T[g]}</span><span>${run.k+1} / ${run.ids.length}</span></div>
    <p class="q">${esc(q)}</p>
    <div class="choices">${opts.map((o,j)=>`<button class="ch" id="c${j}" data-ok="${o.ok?1:0}"><span class="k">${"ABCD"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>
    <div class="row"><button class="btn ghost" id="quit">やめる</button></div>`;
  $("#quit").onclick=()=>{show("home");home()};
  $("#quiz").querySelectorAll(".ch").forEach(b=>b.onclick=()=>{
    const good=b.dataset.ok==="1";
    $("#quiz").querySelectorAll(".ch").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("right")});
    play(good?"ok":"ng");
    if(!good){b.classList.add("wrong");run.miss.push(i)}else run.ok++;
    const r=S[i]||{c:0,w:0};good?r.c++:r.w++;r.last=good?1:0;S[i]=r;save();
    $("#fb").innerHTML=`<div class="fb ${good?"":"ng"}"><strong>${good?"正解":"不正解　正解："+esc(ch[0])}</strong>${esc(ex)}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="nx">${run.k+1<run.ids.length?"次の問題":"結果を見る"}</button></div>`;
    $("#nx").focus();$("#nx").onclick=()=>{play("tap");run.k++;run.k<run.ids.length?ask():result()};
  });
}
function result(){
  const n=run.ids.length;play("end",run.ok/n);
  $("#quiz").innerHTML=`<div class="card">
    <div class="label">結果</div>
    <div><span class="score">${run.ok}</span> <span class="meta" style="display:inline">/ ${n}問正解（${Math.round(run.ok/n*100)}%）</span></div>
    ${run.miss.length?`<div class="label">間違えた問題</div><ul class="miss">${run.miss.map(i=>`<li><b>${esc(Q[i][1])}</b>正解：${esc(Q[i][2][0])}</li>`).join("")}</ul>`:"<p>全問正解。</p>"}
    <div class="row">${run.miss.length?'<button class="btn" id="again">間違いだけ解き直す</button>':""}<button class="btn ghost" id="back">メニューへ</button></div></div>`;
  const m=run.miss;if(m.length)$("#again").onclick=()=>{run={ids:shuf(m),k:0,ok:0,miss:[]};ask()};
  $("#back").onclick=()=>{show("home");home()};
}
function ref(){
  $("#ref").innerHTML=Object.values(D).map(d=>`<div class="drug"><h3>${d.n}${d.nw?'<span class="new">2026年追加</span>':''}</h3>
    <dl><dt>分類</dt><dd>${d.cls}</dd><dt>主な配合先</dt><dd>${d.use}</dd><dt>ポイント</dt><dd>${d.pt}</dd></dl></div>`).join("")+
   `<div class="drug"><h3>販売ルールの要点</h3><dl>
    <dt>18歳未満</dt><dd>小容量1個のみ。対面またはビデオ通話等で情報提供。氏名も確認。</dd>
    <dt>18歳以上</dt><dd>小容量1個は区分どおり（ネット販売も可）。大容量・複数個は対面等＋理由確認。</dd>
    <dt>小容量</dt><dd>5日分以下（かぜ薬・解熱鎮痛薬・鼻炎用内服薬は7日分以下）。</dd>
    <dt>除外</dt><dd>外用剤、生薬を主たる有効成分とする製剤。</dd>
    <dt>情報提供</dt><dd>書面で濫用の危険を伝え、理解と質問の有無を確認。</dd></dl></div>`;
}
function show(id){["home","quiz","ref"].forEach(s=>$("#"+s).hidden=s!==id);
  $("#tab-drill").setAttribute("aria-selected",id!=="ref");$("#tab-ref").setAttribute("aria-selected",id==="ref");scrollTo(0,0)}
$("#tab-drill").onclick=()=>{show("home");home()};
$("#tab-ref").onclick=()=>{ref();show("ref")};
$("#t-bgm").onclick=()=>{P.bgm=!P.bgm;sndSave();sndUI();P.bgm?bgmStart():bgmStop()};

sndUI();home();
