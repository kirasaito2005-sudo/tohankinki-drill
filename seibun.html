<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登販 成分カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<style>
/* Layout: one study column — filter bar, a single large flip card, judge buttons; a searchable index below */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f6f8f6; --line:#d5ddd8;
  --ink:#17241e; --muted:#5a6a62; --accent:#0e6a55; --accent-ink:#ffffff; --accent-soft:#dcece6;
  --t-seibun:#2d5b9a; --t-shoyaku:#7a5a1b; --t-kampo:#b0392a;
  --ok:#1f7a4a; --ng:#a8432f; --warn-bg:#fbf1e6; --warn-ink:#7a4410;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111815; --surface:#1a2420; --surface-2:#202c27; --line:#2f3d37;
  --ink:#e4ece8; --muted:#9db0a7; --accent:#4fbf9c; --accent-ink:#0c1a15; --accent-soft:#1f3a31;
  --t-seibun:#86aee8; --t-shoyaku:#d6b06a; --t-kampo:#f08a78;
  --ok:#5cc98d; --ng:#ef8a73; --warn-bg:#2e2416; --warn-ink:#f0c18a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1a2420; --surface-2:#202c27; --line:#2f3d37;
  --ink:#e4ece8; --muted:#9db0a7; --accent:#4fbf9c; --accent-ink:#0c1a15; --accent-soft:#1f3a31;
  --t-seibun:#86aee8; --t-shoyaku:#d6b06a; --t-kampo:#f08a78;
  --ok:#5cc98d; --ng:#ef8a73; --warn-bg:#2e2416; --warn-ink:#f0c18a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
.back-link{font-size:.85rem;color:var(--accent);font-weight:700;text-decoration:none}
.back-link:hover{text-decoration:underline}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:500;margin-left:.6em;letter-spacing:0}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.filters{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.08em;min-width:3.5em}
select,input[type=search]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.88rem;border:0;background:none;color:var(--ink);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.pos{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

.card{perspective:1600px;cursor:pointer;min-height:360px;position:relative}
.inner{position:relative;min-height:360px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;display:grid}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 0 var(--line)}
.back{transform:rotateY(180deg)}
.face[data-t="成分"]{border-top:5px solid var(--t-seibun)}
.face[data-t="生薬"]{border-top:5px solid var(--t-shoyaku)}
.face[data-t="漢方"]{border-top:5px solid var(--t-kampo)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.78rem;color:var(--muted)}
.type{font-weight:700;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.06em}
.type[data-t="成分"]{color:var(--t-seibun)} .type[data-t="生薬"]{color:var(--t-shoyaku)} .type[data-t="漢方"]{color:var(--t-kampo)}
.known-dot{margin-left:auto;font-weight:700;color:var(--ok)}
.front .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;padding:12px 0}
.name{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,5.2vw,2.3rem);line-height:1.35;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.yomi{font-size:.85rem;color:var(--muted);letter-spacing:.1em}
.q{font-size:1.05rem;line-height:1.8;text-align:left;max-width:34em}
.hint{font-size:.78rem;color:var(--muted);text-align:center}
.back .name{font-size:1.35rem;text-align:left}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:.93rem}
dt{font-size:.72rem;color:var(--muted);letter-spacing:.08em;padding-top:.25em;white-space:nowrap}
dd{margin:0;min-width:0}
dd.cls{font-weight:700;color:var(--accent)}
dd.caution{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:6px 10px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:0 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:0 4px 2px 0}
.judge{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.judge .ng{color:var(--ng)} .judge .ok{color:var(--ok)}
.judge .ng,.judge .ok{padding:12px}
.empty{text-align:center;color:var(--muted);padding:60px 10px;border:1px dashed var(--line);border-radius:var(--r)}
.keys{font-size:.75rem;color:var(--muted);text-align:center}
kbd{font-family:var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}

.list{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);padding:6px 14px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
details{border-top:1px solid var(--line)}
.grp+details{border-top:0}
summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
summary::-webkit-details-marker{display:none}
summary .nm{font-weight:700}
summary .k{font-size:.8rem;color:var(--muted)}
details[open] summary{background:var(--accent-soft)}
details .body{padding:10px 14px 14px}
.count{font-size:.85rem;color:var(--muted)}
footer{font-size:.75rem;color:var(--muted);line-height:1.6}
@media (max-width:520px){
  .judge{grid-template-columns:1fr 1fr}
  .judge .nav{order:2}
  dl{grid-template-columns:1fr;gap:2px}
  dt{padding-top:8px}
  .face{padding:18px 16px 14px}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>登販 成分カード<small>手引き 第3章より</small></h1>
    <div class="stats" id="stats"></div>
    <span style="display:flex;gap:14px;flex-wrap:wrap"><a class="back-link" href="index.html">← してはいけないことドリル</a><a class="back-link" href="ranyou.html">濫用防止8成分ドリル →</a></span>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-card" aria-selected="true">カード学習</button>
    <button role="tab" id="tab-list" aria-selected="false">一覧・検索</button>
  </div>

  <section class="filters" aria-label="出題範囲">
    <div class="row"><span class="lbl">薬効群</span><select id="grp"></select></div>
    <div class="row"><span class="lbl">種別</span>
      <div class="seg" id="seg-t">
        <button data-v="" aria-pressed="true">すべて</button><button data-v="成分" aria-pressed="false">成分</button><button data-v="生薬" aria-pressed="false">生薬</button><button data-v="漢方" aria-pressed="false">漢方</button>
      </div>
    </div>
    <div class="row" id="cardopts"><span class="lbl">出題</span>
      <div class="seg" id="seg-m">
        <button data-v="name" aria-pressed="true">名前→中身</button><button data-v="rev" aria-pressed="false">作用→名前</button>
      </div>
      <label class="chk"><input type="checkbox" id="only-todo"> 未習得だけ</label>
      <button class="btn" id="shuffle">シャッフル</button>
    </div>
  </section>

  <section id="view-card" style="display:flex;flex-direction:column;gap:12px">
    <div class="progress"><i id="bar"></i></div>
    <div class="pos"><span id="pos"></span><span id="grpname"></span></div>
    <div id="stage"></div>
    <div class="judge" id="judge">
      <button class="btn nav" id="prev" aria-label="前のカード">←</button>
      <button class="btn ng" id="ng">まだ</button>
      <button class="btn ok" id="ok">覚えた</button>
      <button class="btn nav" id="next" aria-label="次のカード">→</button>
    </div>
    <div class="keys"><kbd>Space</kbd> めくる　<kbd>←</kbd><kbd>→</kbd> 移動　<kbd>J</kbd> まだ　<kbd>K</kbd> 覚えた</div>
  </section>

  <section id="view-list" hidden style="flex-direction:column;gap:10px">
    <input type="search" id="q" placeholder="成分名・作用・配合先で検索（例：抗コリン、偽アルドステロン、15歳未満）">
    <div class="count" id="lcount"></div>
    <div class="list" id="list"></div>
  </section>

  <footer>出典：厚生労働省「登録販売者試験 試験問題の作成に関する手引き（令和8年4月一部改訂）」第3章。代表的な成分を抜粋・要約しています。漢方の「配合先」欄はカンゾウ・マオウ・ダイオウの有無です。覚えた記録はこのブラウザにだけ保存されます。</footer>
</div>

<script>
const D=[];
// t: 種別(成分/生薬/漢方)  g: 手引きの章立て  n: 名前  y: 読み  k: 分類  e: 作用・特徴  w: 主な配合先  x: 注意(副作用・禁忌・相談)
D.push(
// ===== Ⅰ-1 かぜ薬 =====
{g:"Ⅰ-1 かぜ薬",t:"成分",n:"トラネキサム酸",k:"抗炎症成分",e:"体内での起炎物質の産生を抑制し、炎症の発生を抑えて腫れを和らげる（鼻粘膜や喉の腫れ）",w:"かぜ薬、口腔咽喉薬・含嗽薬、鼻炎用内服薬",x:"凝固した血液を溶解されにくくする働きがあるため、血栓のある人（脳血栓、心筋梗塞、血栓性静脈炎等）や血栓を起こすおそれのある人は医師・薬剤師に相談"},
{g:"Ⅰ-1 かぜ薬",t:"成分",n:"グリチルリチン酸二カリウム",k:"抗炎症成分",e:"作用本体のグリチルリチン酸の化学構造がステロイド性抗炎症成分に類似しており、抗炎症作用を示す",w:"かぜ薬、鎮咳去痰薬、口腔咽喉薬、鼻炎用薬、点眼薬、外皮用薬、歯槽膿漏薬など幅広い（甘味料として食品・医薬部外品にも）",x:"大量摂取で偽アルドステロン症。むくみ・心臓病・腎臓病・高血圧のある人や高齢者は、1日最大服用量がグリチルリチン酸として40mg以上の製品で相談。40mg以上の製品は長期連用を避ける。医薬品ではグリチルリチン酸として1日200mgを超えないよう用量設定"},

// ===== Ⅰ-2 解熱鎮痛薬 =====
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"アスピリン（アセチルサリチル酸）",k:"解熱鎮痛成分（サリチル酸系）",e:"プロスタグランジンの産生を抑え、解熱・鎮痛・抗炎症。血液を凝固しにくくさせる作用もある",w:"解熱鎮痛薬、かぜ薬",x:"15歳未満の小児にはいかなる場合も使用不可（ライ症候群）。他の解熱鎮痛成分より胃腸障害を起こしやすい（アスピリンアルミニウムで軽減を図る製品も）。出産予定日12週間以内は使用を避ける。まれに肝機能障害。アスピリン喘息"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"サザピリン・サリチル酸ナトリウム",k:"解熱鎮痛成分（サリチル酸系）",e:"プロスタグランジンの産生を抑え、解熱・鎮痛",w:"解熱鎮痛薬、かぜ薬",x:"15歳未満の小児にはいかなる場合も使用不可（ライ症候群）。サザピリンは「〜ピリン」でも非ピリン系"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"エテンザミド",k:"解熱鎮痛成分（サリチル酸系）",e:"痛みが神経を伝わっていくのを抑える働きが強い。作用の仕組みの違いによる相乗効果を期待し、他の解熱鎮痛成分と組み合わせて配合（ACE処方＝アセトアミノフェン・カフェイン・エテンザミド）",w:"解熱鎮痛薬、かぜ薬",x:"水痘（水疱瘡）又はインフルエンザにかかっている15歳未満の小児は使用を避ける"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"サリチルアミド",k:"解熱鎮痛成分（サリチル酸系）",e:"解熱・鎮痛",w:"かぜ薬、解熱鎮痛薬",x:"水痘（水疱瘡）又はインフルエンザにかかっている15歳未満の小児は使用を避ける"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"アセトアミノフェン",k:"解熱鎮痛成分",e:"主として中枢作用で解熱・鎮痛。末梢での抗炎症作用は期待できない分、胃腸障害は少ない（空腹時に服用できる製品もあるが食後推奨）",w:"解熱鎮痛薬、かぜ薬、小児用坐薬",x:"まれに皮膚粘膜眼症候群、中毒性表皮壊死融解症、急性汎発性発疹性膿疱症、間質性肺炎、腎障害、肝機能障害。用量超過や日頃から飲酒する人で起こりやすい。坐薬と内服薬の併用に注意"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"イブプロフェン",k:"解熱鎮痛成分",e:"プロスタグランジン産生を抑える。アスピリン等より胃腸への悪影響が少なく抗炎症作用も示す（頭痛、咽頭痛、月経痛、腰痛等）",w:"解熱鎮痛薬、かぜ薬",x:"15歳未満の小児にはいかなる場合も使用不可。胃・十二指腸潰瘍、潰瘍性大腸炎、クローン病の既往歴で再発のおそれ。出産予定日12週以内の妊婦は服用しない。まれに肝機能障害、腎障害、無菌性髄膜炎（全身性エリテマトーデス・混合性結合組織病の人で起こりやすい）"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"イソプロピルアンチピリン",k:"解熱鎮痛成分（ピリン系）",e:"解熱・鎮痛作用は比較的強いが抗炎症作用は弱いため、他の解熱鎮痛成分と組み合わせて配合",w:"解熱鎮痛薬、かぜ薬",x:"一般用医薬品で唯一のピリン系。ピリン疹等のアレルギー症状を起こしたことがある人は使用しない"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"生薬",n:"ジリュウ",k:"解熱成分（生薬）",e:"「熱さまし」として用いられてきた。エキス製剤の効能は「感冒時の解熱」",w:"かぜ薬、解熱鎮痛薬",x:"基原：フトミミズ科の Pheretima aspergillum 等の内部を除いたもの"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"生薬",n:"シャクヤク",k:"鎮痛鎮痙成分（生薬）",e:"鎮痛鎮痙作用、鎮静作用を示し、内臓の痛みにも用いられる（同様の目的でボタンピも）",w:"解熱鎮痛薬、婦人薬、胃腸鎮痛鎮痙薬",x:"基原：ボタン科のシャクヤクの根（ボタンピはボタンの根皮）"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"生薬",n:"ボウイ",k:"鎮痛成分（生薬）",e:"鎮痛、尿量増加（利尿）等の作用。日局ボウイは煎薬として筋肉痛、神経痛、関節痛に",w:"解熱鎮痛薬",x:"基原：ツヅラフジ科のオオツヅラフジの蔓性の茎及び根茎"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"成分",n:"メトカルバモール",k:"骨格筋の緊張を鎮める成分",e:"骨格筋の緊張をもたらす脊髄反射を抑制し「筋肉のこり」を和らげる（腰痛、肩こり、筋肉痛、関節痛、神経痛、打撲、捻挫等）",w:"解熱鎮痛薬",x:"鎮静作用があり眠気、めまい、ふらつき→服用後は乗物・機械の運転操作をしない。鎮静成分を含む他の医薬品の併用は避ける。悪心・嘔吐、食欲不振、胃部不快感"},
{g:"Ⅰ-2 解熱鎮痛薬",t:"漢方",n:"芍薬甘草湯",y:"しゃくやくかんぞうとう",k:"漢方処方製剤（鎮痛）",e:"体力に関わらず使用でき、筋肉の急激な痙攣を伴う痛みのあるもののこむらがえり、筋肉の痙攣、腹痛、腰痛",w:"カンゾウ含む",x:"症状があるときのみの服用にとどめ連用は避ける。まれに肝機能障害、間質性肺炎、うっ血性心不全、心室頻拍。心臓病の診断を受けた人は使用を避ける"},

{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンD（エルゴカルシフェロール、コレカルシフェロール）",k:"ビタミン成分（脂溶性）",e:"腸管でのカルシウム吸収及び尿細管でのカルシウム再吸収を促して骨の形成を助ける。骨歯の発育不良、くる病の予防",w:"ビタミン主薬製剤",x:"過剰症：高カルシウム血症（便秘、吐きけ、嘔吐、腹痛、食欲減退、多尿）、異常石灰化"},
{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンE（トコフェロール、トコフェロールコハク酸エステル）",k:"ビタミン成分（脂溶性）",e:"体内の脂質を酸化から守り、血流を改善。末梢血管障害による肩・首すじのこり、手足のしびれ・冷え、しもやけ、更年期症状",w:"ビタミン主薬製剤、婦人薬、痔疾用薬、高コレステロール改善薬",x:"下垂体や副腎系に作用し、生理が早く来たり経血量が多くなることがある（出血が長く続けば受診）"},
{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンB1（チアミン塩化物塩酸塩、チアミン硝化物、フルスルチアミン塩酸塩、ビスイブチアミン等）",k:"ビタミン成分（水溶性）",e:"炭水化物からのエネルギー産生に不可欠、神経の正常な働きを維持、腸管運動を促進。神経痛、筋肉痛・関節痛、手足のしびれ、便秘、眼精疲労、脚気",w:"ビタミン主薬製剤、かぜ薬、解熱鎮痛薬、眠気防止薬",x:""},

{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンB6（ピリドキシン塩酸塩、ピリドキサールリン酸エステル）",k:"ビタミン成分（水溶性）",e:"タンパク質の代謝に関与し、皮膚や粘膜の健康維持、神経機能の維持。口角炎、口内炎、湿疹、にきび、手足のしびれ",w:"ビタミン主薬製剤、乗物酔い防止薬（吐きけ防止）、点眼薬、貧血用薬",x:""},
{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンB12（シアノコバラミン、ヒドロキソコバラミン塩酸塩）",k:"ビタミン成分（水溶性）",e:"赤血球の形成を助け、神経機能を正常に保つ",w:"ビタミン主薬製剤、貧血用薬、点眼薬",x:""},
{g:"ⅩⅢ 滋養強壮保健薬",t:"成分",n:"ビタミンC（アスコルビン酸、アスコルビン酸カルシウム等）",k:"ビタミン成分（水溶性）",e:"抗酸化作用、皮膚や粘膜の機能を正常に保つ、メラニン産生を抑える。しみ、そばかす、色素沈着、歯ぐきからの出血・鼻血の予防",w:"ビタミン主薬製剤、かぜ薬、貧血用薬（鉄の吸収を助ける）、歯槽膿漏薬",x:""},

{g:"ⅩⅣ 漢方・生薬製剤",t:"漢方",n:"防風通聖散",y:"ぼうふうつうしょうさん",k:"漢方処方製剤（肥満症）",e:"体力充実して、腹部に皮下脂肪が多く、便秘がちなものの高血圧や肥満に伴う動悸・肩こり・のぼせ・むくみ・便秘、蓄膿症、湿疹・皮膚炎、ふきでもの、肥満症",w:"カンゾウ・マオウ・ダイオウ含む",x:"体の虚弱な人、胃腸が弱く下痢しやすい人、発汗傾向の著しい人は不向き。小児に対する適用はない。他の瀉下薬との併用は避ける。まれに肝機能障害、間質性肺炎、偽アルドステロン症、腸間膜静脈硬化症"},
{g:"ⅩⅣ 漢方・生薬製剤",t:"漢方",n:"大柴胡湯",y:"だいさいことう",k:"漢方処方製剤（肥満症）",e:"体力が充実して、脇腹からみぞおちあたりにかけて苦しく、便秘の傾向があるものの胃炎、常習便秘、高血圧や肥満に伴う肩こり・頭痛・便秘、神経症、肥満症",w:"ダイオウ含む",x:"体の虚弱な人、胃腸が弱く下痢しやすい人は不向き。まれに肝機能障害、間質性肺炎"},

{g:"ⅩⅣ 漢方・生薬製剤",t:"生薬",n:"ブシ",k:"生薬成分",e:"心筋の収縮力を高めて血液循環を改善。利尿作用、鎮痛作用（プロスタグランジンを抑えないため胃腸障害等の副作用は示さない）",w:"生薬製剤、桂枝加朮附湯など",x:"生のままでは毒性が高く、減毒加工して使用。基原：キンポウゲ科のハナトリカブト又はオクトリカブトの塊根"},

{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"クレゾール石ケン液",k:"殺菌消毒成分（手指・器具）",e:"結核菌を含む一般細菌類、真菌類に比較的広い殺菌消毒作用。大部分のウイルスには作用しない（同様の成分にポリアルキルポリアミノエチルグリシン塩酸塩等）",w:"消毒薬",x:"刺激性が強く原液が直接皮膚に付着しないように。付着したら直ちに石けん水と水で洗い流す"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"エタノール・イソプロパノール（消毒薬）",k:"殺菌消毒成分（手指・器具）",e:"アルコール分が微生物のタンパク質を変性させ、結核菌を含む一般細菌類、真菌類、ウイルスに殺菌消毒作用（イソプロパノールのウイルス不活性効果はエタノールより低い）",w:"消毒薬",x:"脱脂による肌荒れ→皮膚への繰り返し使用には不適。粘膜・目の周り・傷のある部分は避ける。揮発性で引火しやすい。広範囲・長時間では蒸気の吸引に注意"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"次亜塩素酸ナトリウム・サラシ粉",k:"塩素系殺菌消毒成分（器具・設備）",e:"強い酸化力により一般細菌類、真菌類、ウイルス全般に殺菌消毒作用。吐瀉物や血液の殺菌消毒にも適する",w:"消毒薬（器具・設備用）",x:"皮膚刺激性が強く人体には用いない。金属腐食性、プラスチック・ゴムの劣化、漂白作用。酸性の洗剤と混ざると有毒な塩素ガス。有機物の影響を受けやすい"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ジクロロイソシアヌル酸ナトリウム・トリクロロイソシアヌル酸",k:"有機塩素系殺菌消毒成分",e:"塩素臭や刺激性、金属腐食性が比較的抑えられ、プール等の大型設備の殺菌・消毒に",w:"消毒薬（設備用）",x:""},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ジクロルボス・ダイアジノン・フェニトロチオン・フェンチオン等",k:"有機リン系殺虫成分",e:"アセチルコリンエステラーゼと不可逆的に結合して働きを阻害（ハエのウジ防除など）",w:"殺虫剤",x:"ほ乳類・鳥類では速やかに分解され毒性は比較的低いが、高濃度・多量曝露で縮瞳、呼吸困難、筋肉麻痺→直ちに受診"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ペルメトリン・フェノトリン・フタルスリン",k:"ピレスロイド系殺虫成分",e:"除虫菊の成分から開発。神経細胞に直接作用して神経伝達を阻害。速やかに自然分解して残効性が低く家庭用殺虫剤に広く使用",w:"殺虫剤、シラミ駆除用シャンプー・てんか粉（フェノトリン）",x:"フェノトリンは殺虫成分で唯一人体に直接適用される（シラミ駆除）。シラミの刺咬による痒みを和らげる作用はない"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"プロポクスル・メトキサジアゾン",k:"カーバメイト系／オキサジアゾール系殺虫成分",e:"アセチルコリンエステラーゼを阻害するが、結合は可逆的。ピレスロイド系に抵抗性を示す害虫の駆除に",w:"殺虫剤",x:"一般に有機リン系より毒性は低い"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"オルトジクロロベンゼン",k:"有機塩素系殺虫成分",e:"神経細胞に対する作用で殺虫。現在はウジ、ボウフラの防除のみに使用",w:"殺虫剤",x:"DDT等は残留性・体内蓄積性の問題で使われなくなった"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"メトプレン・ピリプロキシフェン",k:"昆虫成長阻害成分",e:"幼若ホルモン類似作用で、幼虫が蛹になるのを妨げる。有機リン系やピレスロイド系に抵抗性があっても効果",w:"殺虫剤",x:"蛹にならない不完全変態の昆虫やダニには無効"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ジフルベンズロン",k:"昆虫成長阻害成分",e:"脱皮時の新しい外殻の形成を阻害し、幼虫の正常な脱皮をできなくする",w:"殺虫剤",x:""},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ピペニルブトキシド（PBO）・チオシアノ酢酸イソボルニル（IBTA）",k:"殺虫補助成分",e:"それ自体の殺虫作用は弱いが、殺虫成分とともに配合して殺虫効果を高める",w:"殺虫剤",x:""},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"ディート",k:"忌避成分",e:"忌避剤の有効成分として最も効果的で、効果の持続性も高い",w:"忌避剤（医薬品・医薬部外品）",x:"動物実験で神経毒性が示唆→生後6ヶ月未満の乳児には使用を避ける。6ヶ月〜12歳未満は顔面を避け、1日の使用限度（6ヶ月〜2歳未満：1日1回、2〜12歳未満：1日1〜3回）を守る"},
{g:"ⅩⅤ 公衆衛生用薬",t:"成分",n:"イカリジン",k:"忌避成分",e:"年齢による使用制限がない忌避成分。蚊やマダニなどに効果",w:"忌避剤",x:"忌避剤は虫さされによる痒みや腫れを和らげる効果はない"},
);

const ORDER=["Ⅰ-1 かぜ薬","Ⅰ-2 解熱鎮痛薬","Ⅰ-3 眠気を促す薬","Ⅰ-4 眠気を防ぐ薬","Ⅰ-5 乗物酔い防止薬","Ⅰ-6 小児鎮静薬","Ⅱ-1 鎮咳去痰薬","Ⅱ-2 口腔咽喉薬・含嗽薬","Ⅲ-1 胃の薬","Ⅲ-2 腸の薬","Ⅲ-3 胃腸鎮痛鎮痙薬","Ⅲ-4 浣腸薬・駆虫薬","Ⅳ-1 強心薬","Ⅳ-2 高コレステロール改善薬","Ⅳ-3 貧血用薬","Ⅳ-4 その他の循環器用薬","Ⅴ-1 痔の薬","Ⅴ-2 泌尿器用薬","Ⅵ 婦人薬","Ⅶ 内服アレルギー用薬","Ⅷ 鼻に用いる薬","Ⅸ 眼科用薬","Ⅹ 皮膚に用いる薬","ⅩⅠ 歯や口中に用いる薬","ⅩⅡ 禁煙補助剤","ⅩⅢ 滋養強壮保健薬","ⅩⅣ 漢方・生薬製剤","ⅩⅤ 公衆衛生用薬"];
D.forEach((d,i)=>{d.id=d.g+"|"+d.n;d._i=i});
D.sort((a,b)=>ORDER.indexOf(a.g)-ORDER.indexOf(b.g)||a._i-b._i);

const $=s=>document.getElementById(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("tohan-known")||"[]"))}catch(e){}
const saveKnown=()=>{try{localStorage.setItem("tohan-known",JSON.stringify([...known]))}catch(e){}};
let pref={};try{pref=JSON.parse(localStorage.getItem("tohan-pref")||"{}")}catch(e){}
const st={g:pref.g||"",t:pref.t||"",m:pref.m||"name",todo:!!pref.todo,deck:[],i:0,flipped:false,view:"card"};
const savePref=()=>{try{localStorage.setItem("tohan-pref",JSON.stringify({g:st.g,t:st.t,m:st.m,todo:st.todo}))}catch(e){}};

// selects
const sel=$("grp");
sel.innerHTML=`<option value="">すべて（${D.length}枚）</option>`+ORDER.map(g=>`<option value="${esc(g)}">${esc(g)}（${D.filter(d=>d.g===g).length}）</option>`).join("");
sel.value=st.g;
function setSeg(id,v){document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)))}
setSeg("seg-t",st.t);setSeg("seg-m",st.m);$("only-todo").checked=st.todo;

function pool(){return D.filter(d=>(!st.g||d.g===st.g)&&(!st.t||d.t===st.t))}
function build(shuffle){
  let p=pool(); if(st.todo)p=p.filter(d=>!known.has(d.id));
  if(shuffle){for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}}
  st.deck=p;st.i=0;st.flipped=false;render();renderList();
}
function stats(){
  const p=pool();const k=p.filter(d=>known.has(d.id)).length;
  $("stats").innerHTML=`この範囲 <b>${k}</b> / ${p.length} 習得`;
}
function wTag(d){
  if(d.t!=="漢方")return esc(d.w);
  return `<span class="tag">${esc(d.w||"カンゾウ・マオウ・ダイオウを含まない")}</span>`;
}
function backHTML(d){
  return `<dl>
    <dt>分類</dt><dd class="cls">${esc(d.k)}</dd>
    <dt>${d.t==="漢方"?"適応":"作用"}</dt><dd>${esc(d.e)}</dd>
    <dt>${d.t==="漢方"?"構成生薬":"主な配合先"}</dt><dd>${wTag(d)}</dd>
    ${d.x?`<dt>注意</dt><dd class="caution">${esc(d.x)}</dd>`:""}
  </dl>`;
}
function render(){
  stats();
  const n=st.deck.length;
  $("bar").style.width=n?((st.i+1)/n*100)+"%":"0";
  if(!n){$("stage").innerHTML=`<div class="empty">${st.todo?"この範囲はすべて「覚えた」になっています。<br>「未習得だけ」を外すと全カードを復習できます。":"該当するカードがありません。"}</div>`;$("pos").textContent="";$("grpname").textContent="";$("judge").hidden=true;return}
  $("judge").hidden=false;
  const d=st.deck[st.i];
  $("pos").textContent=`${st.i+1} / ${n}`;$("grpname").textContent=d.g;
  const meta=`<div class="meta"><span class="type" data-t="${d.t}">${d.t}</span><span>${esc(d.g)}</span>${known.has(d.id)?'<span class="known-dot">✓ 覚えた</span>':""}</div>`;
  const front = st.m==="name"
    ? `<div class="center"><div class="name">${esc(d.n)}</div>${d.y?`<div class="yomi">${esc(d.y)}</div>`:""}</div><div class="hint">分類・作用・配合先・注意を思い出してからタップ</div>`
    : `<div class="center"><div class="q">${esc(d.e)}</div></div><div class="hint">この${d.t==="漢方"?"漢方処方":d.t}は？　タップで答え</div>`;
  $("stage").innerHTML=`<div class="card${st.flipped?" flipped":""}" id="card" tabindex="0" role="button" aria-label="カードをめくる">
    <div class="inner">
      <div class="face front" data-t="${d.t}">${meta}${front}</div>
      <div class="face back" data-t="${d.t}">${meta}<div class="name">${esc(d.n)}${d.y?` <span class="yomi">${esc(d.y)}</span>`:""}</div>${backHTML(d)}</div>
    </div></div>`;
  $("card").onclick=flip;
}
function flip(){st.flipped=!st.flipped;const c=$("card");if(c)c.classList.toggle("flipped",st.flipped)}
function go(k){if(!st.deck.length)return;st.i=(st.i+k+st.deck.length)%st.deck.length;st.flipped=false;render()}
function judge(ok){
  const d=st.deck[st.i];if(!d)return;
  ok?known.add(d.id):known.delete(d.id);saveKnown();
  if(st.todo&&ok){st.deck.splice(st.i,1);if(st.i>=st.deck.length)st.i=0;st.flipped=false;render();renderList()}else{go(1);renderList()}
}
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  const p=pool().filter(d=>!q||[d.n,d.y,d.k,d.e,d.w,d.x].join(" ").toLowerCase().includes(q));
  $("lcount").textContent=`${p.length} 件`;
  let html="",last="";
  p.forEach(d=>{
    if(d.g!==last){html+=`<div class="grp">${esc(d.g)}</div>`;last=d.g}
    html+=`<details><summary><span class="type" data-t="${d.t}">${d.t}</span><span class="nm">${esc(d.n)}</span><span class="k">${esc(d.k)}</span>${known.has(d.id)?'<span class="known-dot" style="margin-left:auto">✓</span>':""}</summary><div class="body">${backHTML(d)}</div></details>`;
  });
  $("list").innerHTML=html||'<div class="empty">該当なし</div>';
}

sel.onchange=()=>{st.g=sel.value;savePref();build(false)};
document.querySelectorAll("#seg-t button").forEach(b=>b.onclick=()=>{st.t=b.dataset.v;setSeg("seg-t",st.t);savePref();build(false)});
document.querySelectorAll("#seg-m button").forEach(b=>b.onclick=()=>{st.m=b.dataset.v;setSeg("seg-m",st.m);savePref();st.flipped=false;render()});
$("only-todo").onchange=e=>{st.todo=e.target.checked;savePref();build(false)};
$("shuffle").onclick=()=>build(true);
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("ok").onclick=()=>judge(true);$("ng").onclick=()=>judge(false);
$("q").oninput=renderList;
function tab(v){st.view=v;$("tab-card").setAttribute("aria-selected",v==="card");$("tab-list").setAttribute("aria-selected",v==="list");
  $("view-card").hidden=v!=="card";$("view-list").hidden=v!=="list";$("view-list").style.display=v==="list"?"flex":"";$("cardopts").hidden=v!=="card"}
$("tab-card").onclick=()=>tab("card");$("tab-list").onclick=()=>tab("list");
document.addEventListener("keydown",e=>{
  if(st.view!=="card"||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="j"||e.key==="J")judge(false);else if(e.key==="k"||e.key==="K")judge(true);
});
build(false);
</script>

</body>
</html>
